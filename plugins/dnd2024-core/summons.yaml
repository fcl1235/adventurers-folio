# --- 寻获坐骑 Find Steed ----------------------------------------------
- id: dnd2024.summon.otherworldly_steed_celestial
  name: {zh: 异界坐骑, en: Otherworldly Steed}
  variant: {zh: 天界, en: Celestial}
  spell: dnd2024.spell.find_steed
  creature_type: celestial
  size: large
  ac: {base: 10, per_slot: 1}
  hp: {base: 5, per_slot: 10}
  hp_dice: {zh: d10，数量等于法术环级, en: "a number of d10s equal to the spell's level"}
  speeds: {walk: 60, fly: 60}
  speeds_require_slot: {fly: 4}
  abilities: {str: 18, dex: 12, con: 14, int: 6, wis: 12, cha: 8}
  senses: {}
  passive_perception: 11
  languages: {zh: 心灵感应 1 里（只与你通信）, en: "Telepathy 1 mile (works only with you)"}
  traits:
    - name: {zh: 生命纽带, en: Life Bond}
      text:
        zh: 当你因 1 环或更高环级的法术回复生命值时，若坐骑在你 5 尺内，它回复同等的生命值。
        en: When you regain Hit Points from a level 1+ spell, the steed regains the same number of Hit Points if you're within 5 feet of it.
  actions:
    - name: {zh: 异界重击, en: Otherworldly Slam}
      kind: melee
      attack: spell
      reach: 5
      damage:
        - {dice: 1d8, per_slot: 1, type: radiant}
  bonus_actions:
    - name: {zh: 治疗触碰, en: Healing Touch}
      kind: heal
      range: 5
      damage:
        - {dice: 2d8, per_slot: 1}
      text:
        zh: 坐骑 5 尺内一个生物回复 2d8 + 法术环级 点生命值。长休后恢复。
        en: One creature within 5 feet of the steed regains a number of Hit Points equal to 2d8 plus the spell's level. Recharges after a Long Rest.

