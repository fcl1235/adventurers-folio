# 2024 语言表：标准 10 项（含必会的通用语）+ 稀有 9 项。
# 来源：SRD 5.2「Character Creation → Choose Languages」的两张表。
#
# id 用 `dnd2024.language.<key>`，`Profile.languages` 存 **key**（与
# `skill.perception` 同一口径）。两处必须对得上：`grant_proficiency:
# language.elvish` 里的 token 就是 key，写错了就等于「会这门语言但查不到名字」。
#
# 语言**不是物种给的**（2024 改了这条）：建卡时通用语自动 + 2 门标准自选，
# 另有职业/特性给的（德鲁伊语、盗贼黑话、游侠的 2 门）。所以本表只有名称与
# 稀有分类，没有物种字段。
#
# 语种名走官方中文译名；`en` 是 SRD 原文（不含商标符号）。
- id: dnd2024.language.common
  name: {zh: 通用语, en: Common}
  rare: false
  # 每个角色都会通用语（SRD 原文：Every player character knows Common.）。
  # 规则层不认 key，所以这条只能由内容标记。
  common: true
