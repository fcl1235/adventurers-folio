id: dnd2024.feat.unarmed_fighting
kind: fighting_style
name: {zh: 徒手战斗, en: Unarmed Fighting}
level: 0
text:
  zh: |-
    当你以徒手打击命中并造成伤害时，你可以造成 1d6 + 你的力量调整值 的钝击伤害，以替代徒手打击的通常伤害；若你进行该攻击检定时未持用任何武器或盾牌，则该 d6 变为 d8。此外，在你自己每个回合开始时，你可以对你擒抱的一个生物造成 1d4 钝击伤害。
  en: |-
    Unarmed Fighting — the full rules text of this feat is not part of SRD 5.2, so this plugin carries the normalized Chinese text as the authoritative copy.
