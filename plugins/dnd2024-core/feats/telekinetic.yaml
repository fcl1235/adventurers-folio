  zh: |-
    智力、感知或魅力 +1（上限 20）。【微念力】你习得“法师之手”戏法；施放时无需言语与姿势成分，可让幽灵手隐形，且其射程与可离开你的距离均增加 30 尺。施法属性为你以此专长提升的属性。【念力推撞】你可以用附赠动作念力推撞 30 尺内一名你可见的生物；目标须成功通过力量豁免，DC = 8 + 你以此专长提升的属性调整值 + 熟练加值，否则被朝你或远离你的方向移动 5 尺。
