text:
  zh: |-
    当你能看见的一个生物以攻击检定命中你 5 尺内的另一生物时，你可以用反应使该目标受到的伤害减少 1d10 + 你的熟练加值。使用此反应时你必须持用盾牌或一把简易/军用武器。
