id: dnd2024.feat.telepathic
kind: general
name: {zh: 心灵感应, en: Telepathic}
level: 4
text:
  zh: |-
    智力、感知或魅力 +1（上限 20）。【心灵低语】你可以对 60 尺内任何你可见的生物进行心灵交流；你的心灵低语使用你掌握的语言，对方只有懂该语言才能理解，且此交流不会让对方向你进行心灵回应。【侦测思想】你始终准备“侦测思想”法术；可不消耗法术位与法术成分地施放一次，如此施放后须完成长休才能再次以该方式施放；也可用相应环阶的法术位施放。施法属性为你以此专长提升的属性。
  en: |-
    Telepathic — the full rules text of this feat is not part of SRD 5.2, so this plugin carries the normalized Chinese text as the authoritative copy.
choices:
  - {id: boost, kind: ability_boost, count: 1, amount: 1, cap: 20, from: [int, wis, cha], label: {zh: 任选一项属性 +1（上限 20）, en: Increase one ability score by 1 (maximum 20)}}
spells: [dnd2024.spell.detect_thoughts]
casting_ability: boost
resources:
  - id: dnd2024.feat.telepathic.free_cast
    kind: charge
    refresh: long_rest
    capacity: 1
    per_spell: true
    label: {zh: 心灵感应的免费施法, en: Telepathic free casting}

powers:
  - id: dnd2024.feat.telepathic.note
    name: {zh: 心灵感应, en: Telepathic}
    kind: passive
    target: self
    text:
      zh: |-
        侦测思想每长休可免法术位施放一次（原文还免除法术成分；本程序不建模施法成分，按原文手动处理）。
      en: |-
        Detect Thoughts can be cast once per long rest without a spell slot (the original also waives components; components are not modelled here, handle them by the book).
    effects:
