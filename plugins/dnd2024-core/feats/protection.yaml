id: dnd2024.feat.protection
kind: fighting_style
name: {zh: 守护, en: Protection}
level: 0
text:
  zh: |-
    当你能看见的一个生物攻击你 5 尺内你以外的目标时，若你持用盾牌，你可以用反应以盾牌格挡；若你在该目标 5 尺内，则引发该次攻击的攻击检定以及直到你下一回合开始前对该目标的其他攻击检定均具有劣势。
  en: |-
    Protection — the full rules text of this feat is not part of SRD 5.2, so this plugin carries the normalized Chinese text as the authoritative copy.
