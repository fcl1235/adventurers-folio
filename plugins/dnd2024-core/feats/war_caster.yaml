  zh: |-
    智力、感知或魅力 +1（上限 20）。【专注】你为维持专注所作的体质豁免检定具有优势。【反应法术】当生物因离开你的触及范围而引发你的借机攻击时，你可以用反应对该生物施放一道法术，而非发动借机攻击；该法术的施法时间必须为一个动作，且只能以该生物为目标。【姿势成分】即使一只手或双手持用武器或盾牌，你也能完成法术的姿势成分。
