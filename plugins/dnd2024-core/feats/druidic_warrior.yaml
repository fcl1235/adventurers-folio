text:
  zh: |-
    你习得两道你选择的德鲁伊戏法（推荐神导术与点点星芒）。这些戏法对你视为游侠法术，其施法属性为感知。每当你获得一个游侠等级时，你可以将其中的一道戏法替换为另一道你选择的德鲁伊戏法。
