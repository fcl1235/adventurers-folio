id: dnd2024.feat.chef
kind: general
name: {zh: 大厨, en: Chef}
level: 4
text:
  zh: |-
    体质或感知 +1（上限 20）。【厨具熟练】若你尚无厨师工具熟练，则获得之。【滋补餐食】短休期间，若你有食材与厨师工具，可为至多 4 + 你的熟练加值 个生物烹制特殊食物；短休结束时，食用该食物并消耗至少一枚生命骰恢复 HP 的生物，额外恢复 1d8 HP。【振奋点心】花 1 小时工作或完成一次长休时，若你有食材与厨师工具，可制作数量等于你熟练加值的点心；点心制作后 8 小时内有效。生物可用附赠动作吃下一份，获得等于你熟练加值的临时 HP。
  en: |-
    Chef — the full rules text of this feat is not part of SRD 5.2, so this plugin carries the normalized Chinese text as the authoritative copy.
