text:
  zh: |-
    智力或感知 +1（上限 20）。【骑乘打击】骑乘时，你对坐骑 5 尺内、体型至少比坐骑小一级的未骑乘生物进行攻击检定时具有优势。【跃开】若你的坐骑成为允许其以敏捷豁免只受一半伤害的效果的目标，则其豁免成功时不受伤害、失败时只受一半伤害；此增益要求你正骑乘该坐骑，且你与坐骑均未失能。【闪避】骑乘时，若你未失能，可强制一次命中坐骑的攻击改为命中你。
