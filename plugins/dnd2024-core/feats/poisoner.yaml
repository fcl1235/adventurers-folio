id: dnd2024.feat.poisoner
kind: general
name: {zh: 毒师, en: Poisoner}
level: 4
text:
  zh: |-
    敏捷或智力 +1（上限 20）。【强效毒素】当你进行造成毒素伤害的伤害掷骰时，该伤害忽略毒素抗性。【调配毒药】你获得毒药工具熟练；花 1 小时使用该工具并消耗价值 50 GP 的材料，可制作数量等于你熟练加值的毒药份数。【毒药份】你可以用附赠动作将一份毒药涂到一把武器或一份弹药上；涂抹后效力持续 1 分钟，或直到你用该物品造成伤害（以较短者为准）。当生物因该涂毒物品受到伤害时，须进行一次体质豁免，DC = 8 + 你以此专长提升的属性调整值 + 你的熟练加值；失败则受到 2d8 毒素伤害，并中毒直到你下一回合结束。
  en: |-
    Poisoner — the full rules text of this feat is not part of SRD 5.2, so this plugin carries the normalized Chinese text as the authoritative copy.
