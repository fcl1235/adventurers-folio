  zh: |-
    智力、感知或魅力 +1（上限 20）。【仪式法术】选择数量等于你熟练加值的、具有仪式标签的 1 环法术；你始终准备这些法术，并可用你拥有的任意法术位施放它们。此后每当你的熟练加值提升，你可再添加一道具有仪式标签的 1 环法术到这些始终准备的法术中。这些法术的施法属性为你以此专长提升的属性。【快速仪式】你可以用仪式法术的正常施法时间（而非仪式所需的延长时间）施放一道你已准备的仪式法术，且不消耗法术位；如此施放后，须完成长休才能再次使用此增益。
