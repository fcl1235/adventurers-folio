id: dnd2024.subclass.paladin.oath_of_devotion
class: dnd2024.class.paladin
name: {zh: 奉献之誓, en: Oath of Devotion}
summary:
  zh: |-
    最经典的骑士誓约：神圣武器+命中加魅力，灵光免疫魅惑，正面对抗最强。
  en: |-
    The Oath of Devotion binds Paladins to the ideals of justice and order. These Paladins meet the archetype of the knight in shining armor. They hold themselves to the highest standards of conduct, and some-for better or worse-hold the rest of the world to the same standards. Many who swear this oath are devoted to gods of law and good and use their gods' tenets as the measure of personal devotion. Others hold angels as their ideals and incorporate images of angelic wings into their helmets or coats of arms. These paladins share the following tenets: - Let your word be your promise. - Protect the weak and never fear to act. - Let your honorable deeds be an example.
unlock_level: 3

powers:
