    name: {zh: 奉献之誓法术, en: Oath of Devotion Spells}
    level: 3
    kind: passive
    target: self
    text:
      zh: |-
        始终准备：护盾术、神圣武器、解除魔法、自由行动等。
      en: |-
        The magic of your oath ensures you always have certain spells ready; when you reach a Paladin level specified in the Oath of Devotion Spells table, you thereafter always have the listed spells prepared. Oath of Devotion Spells Paladin Level Spells Level 3 Paladin Spells Spell School Special 5 Aid, Zone of Truth Daylight Evocation - Magic Circle Abjuration M Revivify Necromancy M Level 4 Paladin Spells Spell School Special Banishment Abjuration C Locate Creature Divination C Level 5 Paladin Spells Spell School Special Geas Enchantment - Raise Dead Necromancy M 13 Freedom of Movement, Guardian of Faith
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

  - id: dnd2024.subclass.paladin.oath_of_devotion.sacred_weapon
    name: {zh: 神圣武器, en: Sacred Weapon}
    level: 3
    kind: passive
    target: self
    text:
      zh: |-
        引导神力：10 分钟内近战攻击命中加魅力调整值，且发出光亮。
      en: |-
        When you take the Attack action, you can expend one use of your Channel Divinity to imbue one Melee weapon that you are holding with positive energy. For 10 minutes or until you use this feature again, you add your Charisma modifier to attack rolls you make with that weapon (minimum bonus of +1), and each time you hit with it, you cause it to deal its normal damage type or Radiant damage. The weapon also emits Bright Light in a 20-foot radius and Dim Light 20 feet beyond that. You can end this effect early (no action required). This effect also ends if you aren't carrying the weapon.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

