id: dnd2024.subclass.cleric.life_domain
class: dnd2024.class.cleric
name: {zh: 生命领域, en: Life Domain}
summary:
  zh: |-
    治疗量最高的领域：所有治疗额外加值，引导神力可群体拉血。
  en: |-
    The Life Domain focuses on the positive energy that helps sustain all life in the multiverse. Clerics who tap into this domain are masters of healing, using that life force to cure many hurts. Existence itself relies on the positive energy associated with this domain, so a Cleric of almost any religious tradition might choose it. This domain is particularly associated with agricultural deities, gods of healing or endurance, and gods of home and community. Religious orders of healing also seek the magic of this domain.
unlock_level: 3

powers:
  - id: dnd2024.subclass.cleric.life_domain.disciple_of_life
    name: {zh: 生命门徒, en: Disciple of Life}
    level: 3
    kind: passive
    target: self
    text:
      zh: |-
        用环位施放的治疗法术，额外恢复 2 + 法术环级 的 HP。
      en: |-
        When a spell you cast with a spell slot restores Hit Points to a creature, that creature regains additional Hit Points on the turn you cast the spell. The additional Hit Points equal 2 plus the spell slot's level.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

  - id: dnd2024.subclass.cleric.life_domain.life_domain_spells
    name: {zh: 生命领域法术, en: Life Domain Spells}
    level: 3
    kind: passive
    target: self
    text:
      zh: |-
        随等级始终准备：祝福、治愈真言、群体治愈真言、复活等。
      en: |-
        Your connection to this divine domain ensures you always have certain spells ready. When you reach a Cleric level specified in the Life Domain Spells table, you thereafter always have the listed spells prepared. Life Domain Spells Cleric Level Prepared Spells 3 Aid, Bless, Cure Wounds, Lesser Restoration 5 Mass Healing Word, Revivify 7 Aura of Life, Death Ward 9 Greater Restoration, Mass Cure Wounds
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

  - id: dnd2024.subclass.cleric.life_domain.preserve_life
    name: {zh: 保命, en: Preserve Life}
    level: 3
    kind: passive
    target: self
    text:
      zh: |-
        引导神力：30 尺内受伤生物分配共 5 × 牧师等级 的治疗量（不能治疗满血者）。
      en: |-
        As a Magic action, you present your Holy Symbol and expend a use of your Channel Divinity to evoke healing energy that can restore a number of Hit Points equal to five times your Cleric level. Choose Bloodied creatures within 30 feet of yourself (which can include you), and divide those Hit Points among them. This feature can restore a creature to no more than half its Hit Point maximum.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

  - id: dnd2024.subclass.cleric.life_domain.blessed_healer
    name: {zh: 受福治疗者, en: Blessed Healer}
    level: 6
    kind: passive
    target: self
    text:
      zh: |-
        治疗他人时，自己同时恢复 2 + 环级 的 HP。
      en: |-
        The healing spells you cast on others heal you as well. Immediately after you cast a spell with a spell slot that restores Hit Points to one or more creatures other than yourself, you regain Hit Points equal to 2 plus the spell slot's level.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

  - id: dnd2024.subclass.cleric.life_domain.supreme_healing
    name: {zh: 至高治疗, en: Supreme Healing}
    level: 17
    kind: passive
    target: self
    text:
      zh: |-
        治疗骰全部取最大值（2d6 直接按 12 算）。
      en: |-
        When you would normally roll one or more dice to restore Hit Points to a creature with a spell or Channel Divinity, don't roll those dice for the healing; instead use the highest number possible for each die. For example, instead of restoring 2d6 Hit Points to a creature with a spell, you restore 12.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.
