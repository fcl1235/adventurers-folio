id: dnd2024.subclass.warlock.fiend_patron
class: dnd2024.class.warlock
name: {zh: 邪魔宗主, en: Fiend Patron}
summary:
  zh: |-
    邪魔宗主：击杀回临时血、命运加骰，最直白的爆发与续航。
  en: |-
    Your pact draws on the Lower Planes, the realms of perdition. You might forge a bargain with a demon lord, an archdevil, or another fiend that is especially mighty. That patron's aims are evil-the corruption or destruction of all things, ultimately including you-and your path is defined by the extent to which you strive against those aims.
unlock_level: 3

powers:
  - id: dnd2024.subclass.warlock.fiend_patron.dark_one_s_blessing
    name: {zh: 邪魔祝福, en: Dark One's Blessing}
    level: 3
    kind: passive
    target: self
    text:
      zh: |-
        把敌人打到 0 HP 时，获得魅力调整值 + 邪术师等级 的临时 HP。
      en: |-
        When you reduce an enemy to 0 Hit Points, you gain Temporary Hit Points equal to your Charisma modifier plus your Warlock level (minimum of 1 Temporary Hit Point). You also gain this benefit if someone else reduces an enemy within 10 feet of you to 0 Hit Points.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

  - id: dnd2024.subclass.warlock.fiend_patron.fiend_spells
    name: {zh: 邪魔法术, en: Fiend Spells}
    level: 3
    kind: passive
    target: self
    text:
      zh: |-
        始终准备：灼热射线、定身术、火球术、石墙术等。
      en: |-
        The magic of your patron ensures you always have certain spells ready; when you reach a Warlock level specified in the Fiend Spells table, you thereafter always have the listed spells prepared. Fiend Spells Warlock Level Spells 3 Burning Hands, Command, Scorching Ray, Suggestion 5 Fireball, Stinking Cloud 7 Fire Shield, Wall of Fire 9 Geas, Insect Plague
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

  - id: dnd2024.subclass.warlock.fiend_patron.dark_one_s_own_luck
    name: {zh: 邪魔好运, en: Dark One's Own Luck}
    level: 6
    kind: passive
    target: self
    text:
      zh: |-
        属性检定或豁免可加 1d10（1 次/短休）。
      en: |-
        You can call on your fiendish patron to alter fate in your favor. When you make an ability check or a saving throw, you can use this feature to add 1d10 to your roll. You can do so after seeing the roll but before any of the roll's effects occur. You can use this feature a number of times equal to your Charisma modifier (minimum of once), but you can use it no more than once per roll. You regain all expended uses when you finish a Long Rest.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

  - id: dnd2024.subclass.warlock.fiend_patron.fiendish_resilience
    name: {zh: 邪魔韧性, en: Fiendish Resilience}
    level: 10
    kind: passive
    target: self
    text:
      zh: |-
        每次短休/长休选 1 种伤害类型（力场除外），获得其抗性。
      en: |-
        Choose one damage type, other than Force, whenever you finish a Short or Long Rest. You have Resistance to that damage type until you choose a different one with this feature.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

  - id: dnd2024.subclass.warlock.fiend_patron.hurl_through_hell
    name: {zh: 掷入地狱, en: Hurl Through Hell}
    level: 14
    kind: passive
    target: self
    text:
      zh: |-
        每回合一次：命中后把目标打入下层位面，回来时受 8d10 心灵伤害。
      en: |-
        Once per turn when you hit a creature with an attack roll, you can try to instantly transport the target through the Lower Planes. The target must succeed on a Charisma saving throw against your spell save DC, or the target disappears and hurtles through a nightmare landscape. The target takes 8d10 Psychic damage if it isn't a Fiend, and it has the Incapacitated condition until the end of your next turn, when it returns to the space it previously occupied or the nearest unoccupied space. Once you use this feature, you can't use it again until you finish a Long Rest unless you expend a Pact Magic spell slot (no action required) to restore your use of it.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.
