id: dnd2024.subclass.bard.college_of_lore
class: dnd2024.class.bard
name: {zh: 学识学院, en: College of Lore}
summary:
  zh: |-
    靠知识与嘴炮取胜的万金油诗人：技能最多、法术最杂、能削弱敌人检定。
  en: |-
    Bards of the College of Lore collect spells and secrets from diverse sources, such as scholarly tomes, mystical rites, and peasant tales. The college's members gather in libraries and universities to share their lore with one another. They also meet at festivals or affairs of state, where they can expose corruption, unravel lies, and poke fun at self-important figures of authority.
unlock_level: 3

powers:
  - id: dnd2024.subclass.bard.college_of_lore.bonus_proficiencies
    name: {zh: 额外熟练, en: Bonus Proficiencies}
    level: 3
    kind: passive
    target: self
    text:
      zh: |-
        任选 3 项技能获得熟练。
      en: |-
        You gain proficiency with three skills of your choice.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

  - id: dnd2024.subclass.bard.college_of_lore.cutting_words
    name: {zh: 尖刻嘲讽, en: Cutting Words}
    level: 3
    kind: passive
    target: self
    text:
      zh: |-
        反应：60 尺内一名生物做攻击检定、属性检定或伤害掷骰时，消耗 1 次灵感让结果减去灵感骰。
      en: |-
        You learn to use your wit to supernaturally distract, confuse, and otherwise sap the confidence and competence of others. When a creature that you can see within 60 feet of yourself makes a damage roll or succeeds on an ability check or attack roll, you can take a Reaction to expend one use of your Bardic Inspiration; roll your Bardic Inspiration die, and subtract the number rolled from the creature's roll, reducing the damage or potentially turning the success into a failure.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

  - id: dnd2024.subclass.bard.college_of_lore.magical_discoveries
    name: {zh: 魔法发现, en: Magical Discoveries}
    level: 6
    kind: passive
    target: self
    text:
      zh: |-
        从牧师、德鲁伊或法师列表学 2 个法术（戏法或有环位的都可），视为诗人法术。
      en: |-
        You learn two spells of your choice. These spells can come from the Cleric, Druid, or Wizard spell list or any combination thereof (see a class's section for its spell list). A spell you choose must be a cantrip or a spell for which you have spell slots, as shown in the Bard Features table. You always have the chosen spells prepared, and whenever you gain a Bard level, you can replace one of the spells with another spell that meets these requirements.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.

  - id: dnd2024.subclass.bard.college_of_lore.peerless_skill
    name: {zh: 无双技艺, en: Peerless Skill}
    level: 14
    kind: passive
    target: self
    text:
      zh: |-
        属性检定或攻击失败时，可消耗 1 次灵感加骰，可能翻盘（失败也消耗）。
      en: |-
        When you make an ability check or attack roll and fail, you can expend one use of Bardic Inspiration; roll the Bardic Inspiration die, and add the number rolled to the d20, potentially turning a failure into a success. On a failure, the Bardic Inspiration isn't expended.
    effects:
      - note:
          zh: |-
            本条尚未接入数值原语，规则原文如上。
          en: |-
            No numeric primitive is wired to this feature yet; the rule text above is the source.
