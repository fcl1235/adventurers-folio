# 由 tools/gen_spells.py 从 data/raw/spells.json + dnd55e_spells.json 生成。
# 第 4 环，共 34 条。重跑生成器会覆盖；要长期改动请改数据源。
# 没有结构化伤害的法术（控制类）只登记规则原文，damage 留空 —— 不猜。
  - id: dnd2024.spell.arcane_eye
    name: {zh: 奥术之眼, en: Arcane Eye}
    level: 4
    school: divination
    casting: action
    range: {feet: 30}
    components: [v, s, m]
    material: "a bit of bat fur"
    duration: {kind: time, zh: 专注，最多 1 小时, en: up to 1 hour}
    concentration: true
    text:
      zh: |-
        造出隐形眼, 可飞行侦查 30 分钟。
      en: |-
        You create an Invisible, invulnerable eye within range that hovers for the duration. You mentally receive visual information from the eye, which can see in every direction. It also has Darkvision with a range of 30 feet. As a Bonus Action, you can move the eye up to 30 feet in any direction. A solid barrier blocks the eye's movement, but the eye can pass through an opening as small as 1 inch in diameter.

  - id: dnd2024.spell.aura_of_life
    name: {zh: 生命灵光, en: Aura of Life}
    level: 4
    school: abjuration
    casting: action
    range: self
    components: [v]
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    area: {shape: emanation, feet: 30}
    text:
      zh: |-
        30 尺内同伴免疫死尸化, 并每回合回复 1 HP(专注 10 分钟)。
      en: |-
        An aura radiates from you in a 30-foot Emanation for the duration. While in the aura, you and your allies have Resistance to Necrotic damage, and your Hit Point maximums can't be reduced. If an ally with 0 Hit Points starts its turn in the aura, that ally regains 1 Hit Point.

  - id: dnd2024.spell.banishment
    name: {zh: 放逐术, en: Banishment}
    level: 4
    school: abjuration
    casting: action
    range: {feet: 30}
    components: [v, s, m]
    material: "a pentacle"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: cha
    upcast: "You can target one additional creature for each spell slot level above 4."
    text:
      zh: |-
        魅力豁免失败则目标被放逐到无害半位面(专注 1 分钟)。
      en: |-
        One creature that you can see within range must succeed on a Charisma saving throw or be transported to a harmless demiplane for the duration. While there, the target has the Incapacitated condition. When the spell ends, the target reappears in the space it left or in the nearest unoccupied space if that space is occupied. If the target is an Aberration, a Celestial, an Elemental, a Fey, or a Fiend, the target doesn't return if the spell lasts for 1 minute. The target is instead transported to a random location on a plane (GM's choice) associated with its creature type.

  - id: dnd2024.spell.black_tentacles
    name: {zh: 黑触手, en: Black Tentacles}
    level: 4
    school: conjuration
    casting: action
    range: {feet: 90}
    components: [v, s, m]
    material: "a tentacle"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: str
    damage: {type: bludgeoning, 4: 3d6}
    text:
      zh: |-
        20 尺半径触手, 力量豁免失败被束缚并受 3d6 钝击(专注 1 分钟)。
      en: |-
        Squirming, ebony tentacles fill a 20-foot square on ground that you can see within range. For the duration, these tentacles turn the ground in that area into Difficult Terrain. Each creature in that area makes a Strength saving throw. On a failed save, it takes 3d6 Bludgeoning damage, and it has the Restrained condition until the spell ends. A creature also makes that save if it enters the area or ends it turn there. A creature makes that save only once per turn. A Restrained creature can take an action to make a Strength (Athletics) check against your spell save DC, ending the condition on itself on a success.

  - id: dnd2024.spell.blight
    name: {zh: 枯萎术, en: Blight}
    level: 4
    school: necromancy
    casting: action
    range: {feet: 30}
    components: [v, s]
    duration: instant
    save: con
    damage: {type: necrotic, 4: 8d8}
    upcast: "The damage increases by 1d8 for each spell slot level above 4."
    text:
      zh: |-
        目标体质豁免失败受 8d8 黯蚀伤害(植物劣势)。
      en: |-
        A creature that you can see within range makes a Constitution saving throw, taking 8d8 Necrotic damage on a failed save or half as much damage on a successful one. A Plant creature automatically fails the save. Alternatively, target a nonmagical plant that isn't a creature, such as a tree or shrub. It doesn't make a save; it simply withers and dies.

  - id: dnd2024.spell.charm_monster
    name: {zh: 魅惑怪物, en: Charm Monster}
    level: 4
    school: enchantment
    casting: action
    range: {feet: 30}
    components: [v, s]
    duration: {kind: time, zh: 1 小时, en: 1 hour}
    save: wis
    upcast: "You can target one additional creature for each spell slot level above 4."
    text:
      zh: |-
        魅惑一个任意类型生物 1 小时。
      en: |-
        One creature you can see within range makes a Wisdom saving throw. It does so with Advantage if you or your allies are fighting it. On a failed save, the target has the Charmed condition until the spell ends or until you or your allies damage it. The Charmed creature is Friendly to you. When the spell ends, the target knows it was Charmed by you.

  - id: dnd2024.spell.compulsion
    name: {zh: 强制术, en: Compulsion}
    level: 4
    school: enchantment
    casting: action
    range: {feet: 30}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: wis
    text:
      zh: |-
        专注 1 分钟, 目标必须按你指定的方向移动。
      en: |-
        Each creature of your choice that you can see within range must succeed on a Wisdom saving throw or have the Charmed condition until the spell ends. For the duration, you can take a Bonus Action to designate a direction that is horizontal to you. Each Charmed target must use as much of its movement as possible to move in that direction on its next turn, taking the safest route. After moving in this way, a target repeats the save, ending the spell on itself on a success.

  - id: dnd2024.spell.confusion
    name: {zh: 困惑术, en: Confusion}
    level: 4
    school: enchantment
    casting: action
    range: {feet: 90}
    components: [v, s, m]
    material: "three nut shells"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: wis
    area: {shape: sphere, feet: 10}
    upcast: "The Sphere's radius increases by 5 feet for each spell slot level above 4."
    text:
      zh: |-
        10 尺半径内生物行为混乱(专注 1 分钟)。
      en: |-
        Each creature in a 10-foot-radius Sphere centered on a point you choose within range must succeed on a Wisdom saving throw, or that target can't take Bonus Actions or Reactions and must roll 1d10 at the start of each of its turns to determine its behavior for that turn, consulting the table below. 1d10 Behavior for the Turn 2-6 The target doesn't move or take actions. 9-10 The target chooses its behavior. At the end of each of its turns, an affected target repeats the save, ending the spell on itself on a success.

  - id: dnd2024.spell.conjure_minor_elementals
    name: {zh: 召唤次等元素, en: Conjure Minor Elementals}
    level: 4
    school: conjuration
    casting: action
    range: self
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    area: {shape: emanation, feet: 15}
    upcast: "The damage increases by 1d8 for each spell slot level above 4."
    text:
      zh: |-
        召唤精魂元素, 造成 4d8 元素伤害(专注 10 分钟)。
      en: |-
        You conjure spirits from the Elemental Planes that flit around you in a 15-foot Emanation for the duration. Until the spell ends, any attack you make deals an extra 2d8 damage when you hit a creature in the Emanation. This damage is Acid, Cold, Fire, or Lightning (your choice when you make the attack). In addition, the ground in the Emanation is Difficult Terrain for your enemies.

  - id: dnd2024.spell.conjure_woodland_beings
    name: {zh: 召唤林地生物, en: Conjure Woodland Beings}
    level: 4
    school: conjuration
    casting: action
    range: self
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    save: wis
    area: {shape: emanation, feet: 10}
    damage: {type: force, 4: 5d8}
    upcast: "The damage increases by 1d8 for each spell slot level above 4."
    text:
      zh: |-
        召唤精魂精类, 可传送并造成伤害(专注 10 分钟)。
      en: |-
        You conjure nature spirits that flit around you in a 10-foot Emanation for the duration. Whenever the Emanation enters the space of a creature you can see and whenever a creature you can see enters the Emanation or ends its turn there, you can force that creature to make a Wisdom saving throw. The creature takes 5d8 Force damage on a failed save or half as much damage on a successful one. A creature makes this save only once per turn. In addition, you can take the Disengage action as a Bonus Action for the spell's duration.

  - id: dnd2024.spell.control_water
    name: {zh: 操控水体, en: Control Water}
    level: 4
    school: transmutation
    casting: action
    range: {feet: 300}
    components: [v, s, m]
    material: "a mixture of water and dust"
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    save: str
    damage: {type: bludgeoning, 4: 2d8}
    text:
      zh: |-
        操控 100 尺内的水体(洪水/分流/漩涡, 专注 10 分钟)。
      en: |-
        Until the spell ends, you control any water inside an area you choose that is a Cube up to 100 feet on a side, using one of the following effects. As a Magic action on your later turns, you can repeat the same effect or choose a different one. Flood. You cause the water level of all standing water in the area to rise by as much as 20 feet. If you choose an area in a large body of water, you instead create a 20-foot tall wave that travels from one side of the area to the other and then crashes. Any Huge or smaller vehicles in the wave's path are carried with it to the other side. Any Huge or smaller vehicles struck by the wave have a 25 percent chance of capsizing. The water level remains elevated until the spell ends or you choose a different effect. If this effect produced a wave, the wave repeats on the start of your next turn while the flood effect lasts. Part Water. You part water in the area and create a trench. The trench extends across the spell's area, and the separated water forms a wall to either side. The trench remains until the spell ends or you choose a different effect. The water then slowly fills in the trench over the course of the next round until the normal water level is restored. conditions to take effect. Once they do so, you can change the conditions again. When the spell ends, the weather gradually returns to normal. When you change the weather conditions, find a current condition on the following tables and change its stage by one, up or down. When changing the wind, you can change its direction. Precipitation Stage | Condition 1 | Clear | 2 | Light clouds 3 | Overcast or ground fog | 4 | Rain, hail, or snow 5 | Torrential rain, driving hail, or blizzard Redirect Flow. You cause flowing water in the area to move in a direction you choose, even if the water has to flow over obstacles, up walls, or in other unlikely directions. The water in the area moves as you direct it, but once it moves beyond the spell's area, it resumes its flow based on the terrain. The water continues to move in the direction you chose until the spell ends or you choose a different effect. Whirlpool. You cause a whirlpool to form in the center of the area, which must be at least 50 feet. Temperature Stage | Condition 1 | Heat wave | 2 | Hot 3 | Warm | 4 | Cool 5 | Cold | 6 | Freezing Counterspell Wind Stage Condition 10 | Calm | 2 | Moderate wind 3 | Strong wind | 4 | Gale 5 | Storm square and 25 feet deep. The whirlpool lasts until you choose a different effect or the spell ends. The whirlpool is 5 feet wide at the base, up to 50 feet wide at the top, and 25 feet tall. Any creature in the water and within 25 feet of the whirlpool is pulled 10 feet toward it. When a creature enters the whirlpool for the first time on a turn or ends its turn there, it makes a Strength saving throw. On a failed save, the creature takes 2d8 Bludgeoning damage. On a successful save, the creature takes half as much damage. A creature can swim away from the whirlpool only if it first takes an action to pull away and succeeds on a Strength (Athletics) check against your spell save DC.

  - id: dnd2024.spell.death_ward
    name: {zh: 防死结界, en: Death Ward}
    level: 4
    school: abjuration
    casting: action
    range: touch
    components: [v, s]
    duration: {kind: time, zh: 8 小时, en: 8 hours}
    text:
      zh: |-
        目标首次降到 0 HP 时改为 1 HP, 持续 8 小时。
      en: |-
        You touch a creature and grant it a measure of protection from death. The first time the target would drop to 0 Hit Points before the spell ends, the target instead drops to 1 Hit Point, and the spell ends. If the spell is still in effect when the target is subjected to an effect that would kill it instantly without dealing damage, that effect is negated against the target, and the spell ends.

  - id: dnd2024.spell.dimension_door
    name: {zh: 任意门, en: Dimension Door}
    level: 4
    school: conjuration
    casting: action
    range: {feet: 500}
    components: [v]
    duration: instant
    damage: {type: force, 4: 4d6}
    text:
      zh: |-
        传送你与 1 个同伴至 500 尺内任意位置。
      en: |-
        You teleport to a location within range. You arrive at exactly the spot desired. It can be a place you can see, one you can visualize, or one you can describe by stating distance and direction, such as "200 feet straight downward" or "300 feet upward to the northwest at a 45-degree angle." You can also teleport one willing creature. The creature must be within 5 feet of you when you teleport, and it teleports to a space within 5 feet of your destination space. If you, the other creature, or both would arrive in a space occupied by a creature or completely filled by one or more objects, you and any creature traveling with you each take 4d6 Force damage, and the teleportation fails.

  - id: dnd2024.spell.divination
    name: {zh: 预言术, en: Divination}
    level: 4
    school: divination
    casting: action
    range: self
    components: [v, s, m]
    material: "incense worth 25+ GP, which the, spell consumes"
    duration: instant
    ritual: true
    text:
      zh: |-
        向神祇询问一个关于 7 天内事件的问题。
      en: |-
        This spell puts you in contact with a god or a god's servants. You ask one question about a specific goal, event, or activity to occur within 7 days. The GM offers a truthful reply, which might be a short phrase or cryptic rhyme. The spell doesn't account for circumstances that might change the answer, such as the casting of other spells. If you cast the spell more than once before finishing a Long Rest, there is a cumulative 25 percent chance for each casting after the first that you get no answer.

  - id: dnd2024.spell.dominate_beast
    name: {zh: 支配野兽, en: Dominate Beast}
    level: 4
    school: enchantment
    casting: action
    range: {feet: 60}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: wis
    upcast: "Your Concentration can last longer with a spell slot of level 5 (up to 10 minutes), 6 (up to 1 hour), or 7+ (up to 8 hours)."
    text:
      zh: |-
        支配一只野兽(专注 1 分钟)。
      en: |-
        One Beast you can see within range must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target has Advantage on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success. You have a telepathic link with the Charmed target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as "Attack that creature," "Move over there," or "Fetch that object." The target does its best to obey on its turn. If it completes an order and doesn't receive further direction from you, it acts and moves as it likes, focusing on protecting itself. You can command the target to take a Reaction but must take your own Reaction to do so.

  - id: dnd2024.spell.fabricate
    name: {zh: 造物术, en: Fabricate}
    level: 4
    school: transmutation
    casting: {kind: time, zh: 10 分钟, en: 10 minutes}
    range: {feet: 120}
    components: [v, s]
    duration: instant
    area: {shape: cube, feet: 10}
    text:
      zh: |-
        把原料变成成品(武器/护甲/家具等)。
      en: |-
        You convert raw materials into products of the same material. For example, you can fabricate a wooden bridge from a clump of trees, a rope from a patch of hemp, or clothes from flax or wool. Choose raw materials that you can see within range. You can fabricate a Large or smaller object (contained within a 10-foot Cube or eight connected 5-foot Cubes) given a sufficient quantity of material. If you're working with metal, stone, or another mineral substance, however, the fabricated object can be no larger than Medium (contained within a 5-foot Cube). The quality of any fabricated objects is based on the quality of the raw materials. Creatures and magic items can't be created by this spell. You also can't use it to create items that require a high degree of skill-such as weapons and armor-unless you have proficiency with the type of Artisan's Tools used to craft such objects.

  - id: dnd2024.spell.faithful_hound
    name: {zh: 忠犬术, en: Faithful Hound}
    level: 4
    school: conjuration
    casting: action
    range: {feet: 30}
    components: [v, s, m]
    material: "a silver whistle"
    duration: {kind: time, zh: 8 小时, en: 8 hours}
    save: dex
    damage: {type: force, 4: 4d8}
    text:
      zh: |-
        造出隐形猎犬看守区域, 发现入侵者会吠叫并咬击。
      en: |-
        You conjure a phantom watchdog in an unoccupied space that you can see within range. The hound remains for the duration or until the two of you are more than 300 feet apart from each other. No one but you can see the hound, and it is intangible and invulnerable. When a Small or larger creature comes within 30 feet of it without first speaking the password that you specify when you cast this spell, the hound starts barking loudly. The hound has Truesight with a range of 30 feet. At the start of each of your turns, the hound attempts to bite one enemy within 5 feet of it. That enemy must succeed on a Dexterity saving throw or take 4d8 Force damage. On your later turns, you can take a Magic action to move the hound up to 30 feet.

  - id: dnd2024.spell.fire_shield
    name: {zh: 火焰护盾, en: Fire Shield}
    level: 4
    school: evocation
    casting: action
    range: self
    components: [v, s, m]
    material: "a bit of phosphorus or a firefly"
    duration: {kind: time, zh: 10 分钟, en: 10 minutes}
    damage: {type: fire, 4: 2d8}
    text:
      zh: |-
        10 分钟内, 攻击者受 2d8 火焰/寒冷反伤。
      en: |-
        Wispy flames wreathe your body for the duration, shedding Bright Light in a 10-foot radius and Dim Light for an additional 10 feet. The flames provide you with a warm shield or a chill shield, as you choose. The warm shield grants you Resistance to Cold damage, and the chill shield grants you Resistance to Fire damage. In addition, whenever a creature within 5 feet of you hits you with a melee attack roll, the shield erupts with flame. The attacker takes 2d8 Fire damage from a warm shield or 2d8 Cold damage from a chill shield.

  - id: dnd2024.spell.freedom_of_movement
    name: {zh: 行动自如, en: Freedom of Movement}
    level: 4
    school: abjuration
    casting: action
    range: touch
    components: [v, s, m]
    material: "a leather strap"
    duration: {kind: time, zh: 1 小时, en: 1 hour}
    upcast: "You can target one additional creature for each spell slot level above 4."
    text:
      zh: |-
        目标移动不受困难地形/束缚/麻痹限制, 持续 1 小时。
      en: |-
        You touch a willing creature. For the duration, the target's movement is unaffected by Difficult Terrain, and spells and other magical effects can neither reduce the target's Speed nor cause the target to have the Paralyzed or Restrained conditions. The target also has a Swim Speed equal to its Speed. In addition, the target can spend 5 feet of movement to automatically escape from nonmagical restraints, such as manacles or a creature imposing the Grappled condition on it.

  - id: dnd2024.spell.giant_insect
    name: {zh: 巨虫术, en: Giant Insect}
    level: 4
    school: conjuration
    casting: action
    range: {feet: 60}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    upcast: "Use the spell slot's level for the spell's level in the stat block. Large Beast, Unaligned AC 11 + the spell's level HP 30 + 10 for each spell level above 4 Speed 40 ft., Climb 40 ft., Fly 40 ft. (Wasp only) MOD SAVE MOD SAVE MOD SAVE Str 17 +3 +3 dex 13 +1 +1 con 15 +2 +2 int 4 -3 -3 WiS 14 +2 +2 chA 3 -4 -4 Senses Darkvision 60 ft.; Passive Perception 12 Languages Understands the languages you know CR None (XP 0; PB equals your Proficiency Bonus) Traits Spider Climb. The insect can climb difficult surfaces, including along ceilings, without needing to make an ability check. Actions Multiattack. The insect makes a number of attacks equal to half this spell's level (round down). Poison Jab. Melee Attack Roll: Bonus equals your spell attack modifier, reach 10 ft. Hit: 1d6 + 3 plus the spell's level Piercing damage plus 1d4 Poison damage. Web Bolt (Spider Only). Ranged Attack Roll: Bonus equals your spell attack modifier, range 60 ft. Hit: 1d10 + 3 plus the spell's level Bludgeoning damage, and the target's Speed is reduced to 0 until the start of the insect's next turn. Bonus Actions Venomous Spew (Centipede Only). Constitution Saving Throw: Your spell save DC, one creature the insect can see within 10 feet. Failure: The target has the Poisoned condition until the start of the insect's next turn."
    text:
      zh: |-
        把昆虫变为巨型版本为你作战(专注 10 分钟)。
      en: |-
        You summon a giant centipede, spider, or wasp (chosen when you cast the spell). It manifests in an unoccupied space you can see within range and uses the Giant Insect stat block. The form you choose determines certain details in its stat block. The creature disappears when it drops to 0 Hit Points or when the spell ends. The creature is an ally to you and your allies. In combat, the creature shares your Initiative count, but it takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don't issue any, it takes the Dodge action and uses its movement to avoid danger.

  - id: dnd2024.spell.greater_invisibility
    name: {zh: 高等隐形, en: Greater Invisibility}
    level: 4
    school: illusion
    casting: action
    range: touch
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    text:
      zh: |-
        目标隐形 1 分钟且攻击不破隐(专注)。
      en: |-
        A creature you touch has the Invisible condition until the spell ends.

  - id: dnd2024.spell.guardian_of_faith
    name: {zh: 信仰守卫, en: Guardian of Faith}
    level: 4
    school: conjuration
    casting: action
    range: {feet: 30}
    components: [v]
    duration: {kind: time, zh: 8 小时, en: 8 hours}
    save: dex
    text:
      zh: |-
        造出守卫, 10 尺内敌人受 20 点光耀伤害。
      en: |-
        A Large spectral guardian appears and hovers for the duration in an unoccupied space that you can see within range. The guardian occupies that space and is invulnerable, and it appears in a form appropriate for your deity or pantheon. Any enemy that moves to a space within 10 feet of the guardian for the first time on a turn or starts its turn there makes a Dexterity saving throw, taking 20 Radiant damage on a failed save or half as much damage on a successful one. The guardian vanishes when it has dealt a total of 60 damage.

  - id: dnd2024.spell.hallucinatory_terrain
    name: {zh: 幻景地形, en: Hallucinatory Terrain}
    level: 4
    school: illusion
    casting: {kind: time, zh: 10 分钟, en: 10 minutes}
    range: {feet: 300}
    components: [v, s, m]
    material: "a mushroom"
    duration: {kind: time, zh: 24 小时, en: 24 hours}
    area: {shape: cube, feet: 150}
    text:
      zh: |-
        把 150 尺地形变为幻景, 持续 24 小时。
      en: |-
        You make natural terrain in a 150-foot Cube in range look, sound, and smell like another sort of natural terrain. Thus, open fields or a road can be made to resemble a swamp, hill, crevasse, or some other difficult or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road. Manufactured structures, equipment, and creatures within the area aren't changed. The tactile characteristics of the terrain are unchanged, so creatures entering the area are likely to notice the illusion. If the difference isn't obvious by touch, a creature examining the illusion can take the Study action to make an Intelligence (Investigation) check against your spell save DC to disbelieve it. If a creature discerns that the terrain is illusory, the creature sees a vague image superimposed on the real terrain.

  - id: dnd2024.spell.ice_storm
    name: {zh: 冰风暴(4环), en: Ice Storm}
    level: 4
    school: evocation
    casting: action
    range: {feet: 300}
    components: [v, s, m]
    material: "a mitten"
    duration: instant
    save: dex
    damage: {type: bludgeoning, 4: 2d10}
    upcast: "The Bludgeoning damage increases by 1d10 for each spell slot level above 4."
    text:
      zh: |-
        20 尺半径冰雹, 2d8 钝击 + 4d6 寒冷(敏捷豁免减半)。
      en: |-
        Hail falls in a 20-foot-radius, 40-foot-high Cylinder centered on a point within range. Each creature in the Cylinder makes a Dexterity saving throw. A creature takes 2d10 Bludgeoning damage and 4d6 Cold damage on a failed save or half as much damage on a successful one. Hailstones turn ground in the Cylinder into Difficult Terrain until the end of your next turn.

  - id: dnd2024.spell.locate_creature
    name: {zh: 生物定位, en: Locate Creature}
    level: 4
    school: divination
    casting: action
    range: self
    components: [v, s, m]
    material: "fur from a bloodhound"
    duration: {kind: time, zh: 专注，最多 1 小时, en: up to 1 hour}
    concentration: true
    text:
      zh: |-
        得知 1000 尺内某类生物的方向(专注 1 小时)。
      en: |-
        Describe or name a creature that is familiar to you. You sense the direction to the creature's location if that creature is within 1,000 feet of you. If the creature is moving, you know the direction of its movement. The spell can locate a specific creature known to you or the nearest creature of a specific kind (such as a human or a unicorn) if you have seen such a creature up close-within 30 feet-at least once. If the creature you described or named is in a different form, such as under the effects of a Flesh to Stone or Polymorph spell, this spell doesn't locate the creature. This spell can't locate a creature if any thickness of lead blocks a direct path between you and the creature.

  - id: dnd2024.spell.phantasmal_killer
    name: {zh: 幻影杀手, en: Phantasmal Killer}
    level: 4
    school: illusion
    casting: action
    range: {feet: 120}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: wis
    damage: {type: psychic, 4: 4d10}
    upcast: "The damage increases by 1d10 for each spell slot level above 4."
    text:
      zh: |-
        目标感知豁免失败则恐惧并每回合受 4d10 心灵伤害(专注 1 分钟)。
      en: |-
        You tap into the nightmares of a creature you can see within range and create an illusion of its deepest fears, visible only to that creature. The target makes a Wisdom saving throw. On a failed save, the target takes 4d10 Psychic damage and has Disadvantage on ability checks and attack rolls for the duration. On a successful save, the target takes half as much damage, and the spell ends. For the duration, the target makes a Wisdom saving throw at the end of each of its turns. On a failed save, it takes the Psychic damage again. On a successful save, the spell ends.

  - id: dnd2024.spell.polymorph
    name: {zh: 变形术, en: Polymorph}
    level: 4
    school: transmutation
    casting: action
    range: {feet: 60}
    components: [v, s, m]
    material: "a caterpillar cocoon"
    duration: {kind: time, zh: 专注，最多 1 小时, en: up to 1 hour}
    concentration: true
    save: wis
    text:
      zh: |-
        把目标变成野兽(专注 1 小时)。
      en: |-
        You attempt to transform a creature that you can see within range into a Beast. The target must succeed on a Wisdom saving throw or shape-shift into a Beast form for the duration. That form can be any Beast you choose that has a Challenge Rating equal to or less than the target's (or the target's level if it doesn't have a Challenge Rating). The target's game statistics are replaced by the stat block of the chosen Beast, but the target retains its alignment, personality, creature type, Hit Points, and Hit Point Dice. See the "Animals" section of "Monsters" for a sample of Beast stat blocks. The target gains a number of Temporary Hit Points equal to the Hit Points of the Beast form. These Temporary Hit Points vanish if any remain when the spell ends. The spell ends early on the target if it has no Temporary Hit Points left. The target is limited in the actions it can perform by the anatomy of its new form, and it can't speak or cast spells. The target's gear melds into the new form. The creature can't use or otherwise benefit from any of that equipment.

  - id: dnd2024.spell.private_sanctum
    name: {zh: 私人圣所, en: Private Sanctum}
    level: 4
    school: abjuration
    casting: {kind: time, zh: 10 分钟, en: 10 minutes}
    range: {feet: 120}
    components: [v, s, m]
    material: "a thin sheet of lead"
    duration: {kind: time, zh: 24 小时, en: 24 hours}
    upcast: "You can increase the size of the Cube by 100 feet for each spell slot level above 4."
    text:
      zh: |-
        保护一片区域不被探知/传送/窥视, 持续 24 小时。
      en: |-
        You make an area within range magically secure. The area is a Cube that can be as small as 5 feet to as large as 100 feet on each side. The spell lasts for the duration. When you cast the spell, you decide what sort of security the spell provides, choosing any of the following properties: • Sound can't pass through the barrier at the edge of the warded area. • The barrier of the warded area appears dark and foggy, preventing vision (including Darkvision) through it. • Sensors created by Divination spells can't appear inside the protected area or pass through the barrier at its perimeter. • Creatures in the area can't be targeted by Divination spells. • Nothing can teleport into or out of the warded area. • Planar travel is blocked within the warded area. Casting this spell on the same spot every day for 365 days makes the spell last until dispelled.

  - id: dnd2024.spell.resilient_sphere
    name: {zh: 弹性球, en: Resilient Sphere}
    level: 4
    school: abjuration
    casting: action
    range: {feet: 30}
    components: [v, s, m]
    material: "a glass sphere"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: dex
    text:
      zh: |-
        把目标封在力场球内 1 分钟(专注)。
      en: |-
        A shimmering sphere encloses a Large or smaller creature or object within range. An unwilling creature must succeed on a Dexterity saving throw or be enclosed for the duration. Nothing-not physical objects, energy, or other spell effects-can pass through the barrier, in or out, though a creature in the sphere can breathe there. The sphere is immune to all damage, and a creature or object inside can't be damaged by attacks or effects originating from outside, nor can a creature inside the sphere damage anything outside it. The sphere is weightless and just large enough to contain the creature or object inside. An enclosed creature can take an action to push against the sphere's walls and thus roll the sphere at up to half the creature's Speed. Similarly, the globe can be picked up and moved by other creatures. A Disintegrate spell targeting the globe destroys it without harming anything inside.

  - id: dnd2024.spell.secret_chest
    name: {zh: 秘藏箱, en: Secret Chest}
    level: 4
    school: conjuration
    casting: action
    range: touch
    components: [v, s, m]
    material: "a chest, 3 feet by 2 feet by 2 feet, constructed from rare materials worth 5,000+ GP, and a Tiny replica of the chest made from the same materials worth 50+ GP"
    duration: {kind: special, zh: 直到被驱散, en: Until dispelled}
    text:
      zh: |-
        把箱子藏入以太位面 60 天。
      en: |-
        You hide a chest and all its contents on the Ethereal Plane. You must touch the chest and the miniature replica that serve as Material components for the spell. The chest can contain up to 12 cubic feet of nonliving material (3 feet by 2 feet by 2 feet). While the chest remains on the Ethereal Plane, you can take a Magic action and touch the replica to recall the chest. It appears in an unoccupied space on the ground within 5 feet of you. You can send the chest back to the Ethereal Plane by taking a Magic action to touch the chest and the replica. After 60 days, there is a cumulative 5 percent chance at the end of each day that the spell ends. The spell also ends if you cast this spell again or if the Tiny replica chest is destroyed. If the spell ends and the larger chest is on the Ethereal Plane, the chest remains there for you or someone else to find.

  - id: dnd2024.spell.stone_shape
    name: {zh: 塑石术, en: Stone Shape}
    level: 4
    school: transmutation
    casting: action
    range: touch
    components: [v, s, m]
    material: "soft clay"
    duration: instant
    text:
      zh: |-
        把石块塑成任意形状。
      en: |-
        You touch a stone object of Medium size or smaller or a section of stone no more than 5 feet in any dimension and form it into any shape you like. For example, you could shape a large rock into a weapon, statue, or coffer, or you could make a small passage through a wall that is 5 feet thick. You could also shape a stone door or its frame to seal the door shut. The object you create can have up to two hinges and a latch, but finer mechanical detail isn't possible.

  - id: dnd2024.spell.stoneskin
    name: {zh: 石肤术, en: Stoneskin}
    level: 4
    school: transmutation
    casting: action
    range: touch
    components: [v, s, m]
    material: "diamond dust worth 100+ GP, which the spell consumes"
    duration: {kind: time, zh: 专注，最多 1 小时, en: up to 1 hour}
    concentration: true
    text:
      zh: |-
        目标获得钝击/穿刺/挥砍抗性(专注 1 小时)。
      en: |-
        Until the spell ends, one willing creature you touch has Resistance to Bludgeoning, Piercing, and Slashing damage.

  - id: dnd2024.spell.vitriolic_sphere
    name: {zh: 强酸球, en: Vitriolic Sphere}
    level: 4
    school: evocation
    casting: action
    range: {feet: 150}
    components: [v, s, m]
    material: "a drop of bile"
    duration: instant
    save: dex
    area: {shape: sphere, feet: 20}
    damage: {type: acid, 4: 10d4}
    upcast: "The initial damage increases by 2d4 for each spell slot level above 4."
    text:
      zh: |-
        15 尺半径强酸, 10d4 强酸伤害(敏捷豁免减半)。
      en: |-
        You point at a location within range, and a glowing, 1-foot-diameter ball of acid streaks there and explodes in a 20-foot-radius Sphere. Each creature in that area makes a Dexterity saving throw. On a failed save, a creature takes 10d4 Acid damage and another 5d4 Acid damage at the end of its next turn. On a successful save, a creature takes half the initial damage only.

  - id: dnd2024.spell.wall_of_fire
    name: {zh: 火墙术, en: Wall of Fire}
    level: 4
    school: evocation
    casting: action
    range: {feet: 120}
    components: [v, s, m]
    material: "a piece of charcoal"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: dex
    damage: {type: fire, 4: 5d8}
    upcast: "The damage increases by 1d8 for each spell slot level above 4."
    text:
      zh: |-
        造出火墙, 穿过者受 5d8 火焰伤害(专注 1 分钟)。
      en: |-
        You create a wall of fire on a solid surface within range. You can make the wall up to 60 feet long, 20 feet high, and 1 foot thick, or a ringed wall up to 20 feet in diameter, 20 feet high, and 1 foot thick. The wall is opaque and lasts for the duration. When the wall appears, each creature in its area makes a Dexterity saving throw, taking 5d8 Fire damage on a failed save or half as much damage on a successful one. One side of the wall, selected by you when you cast this spell, deals 5d8 Fire damage to each creature that ends its turn within 10 feet of that side or inside the wall. A creature takes the same damage when it enters the wall for the first time on a turn or ends its turn there. The other side of the wall deals no damage.
