# 由 tools/gen_spells.py 从 data/raw/spells.json + dnd55e_spells.json 生成。
# 第 1 环，共 57 条。重跑生成器会覆盖；要长期改动请改数据源。
# 没有结构化伤害的法术（控制类）只登记规则原文，damage 留空 —— 不猜。
  - id: dnd2024.spell.alarm
    name: {zh: 警报术, en: Alarm}
    level: 1
    school: abjuration
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: {feet: 30}
    components: [v, s, m]
    material: "a bell and silver wire"
    duration: {kind: time, zh: 8 小时, en: 8 hours}
    ritual: true
    area: {shape: cube, feet: 20}
    text:
      zh: |-
        结界 20 尺, 有人进入即发出警报(可设为心理提醒)。
      en: |-
        You set an alarm against intrusion. Choose a door, a window, or an area within range that is no larger than a 20-foot Cube. Until the spell ends, an alarm alerts you whenever a creature touches or enters the warded area. When you cast the spell, you can designate creatures that won't set off the alarm. You also choose whether the alarm is audible or mental: Audible Alarm. The alarm produces the sound of a handbell for 10 seconds within 60 feet of the warded area. Mental Alarm. You are alerted by a mental ping if you are within 1 mile of the warded area. This ping awakens you if you're asleep.

  - id: dnd2024.spell.animal_friendship
    name: {zh: 化兽为友, en: Animal Friendship}
    level: 1
    school: enchantment
    casting: action
    range: {feet: 30}
    components: [v, s, m]
    material: "a morsel of food"
    duration: {kind: time, zh: 24 小时, en: 24 hours}
    save: wis
    upcast: "You can target one additional Beast for each spell slot level above 1."
    text:
      zh: |-
        说服一只野兽不攻击你, 持续 24 小时。
      en: |-
        Target a Beast that you can see within range. The target must succeed on a Wisdom saving throw or have the Charmed condition for the duration. If you or one of your allies deals damage to the target, the spells ends.

  - id: dnd2024.spell.bane
    name: {zh: 灾祸术, en: Bane}
    level: 1
    school: enchantment
    casting: action
    range: {feet: 30}
    components: [v, s, m]
    material: "a drop of blood"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: cha
    upcast: "You can target one additional creature for each spell slot level above 1."
    text:
      zh: |-
        专注 1 分钟, 至多 3 个目标攻击与豁免 -1d4。
      en: |-
        Up to three creatures of your choice that you can see within range must each make a Charisma saving throw. Whenever a target that fails this save makes an attack roll or a saving throw before the spell ends, the target must subtract 1d4 from the attack roll or save.

  - id: dnd2024.spell.bless
    name: {zh: 祝福术, en: Bless}
    level: 1
    school: enchantment
    casting: action
    range: {feet: 30}
    components: [v, s, m]
    material: "a Holy Symbol worth 5+ GP"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    upcast: "You can target one additional creature for each spell slot level above 1."
    text:
      zh: |-
        专注 1 分钟, 至多 3 个目标攻击与豁免 +1d4。
      en: |-
        You bless up to three creatures within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target adds 1d4 to the attack roll or save.

  - id: dnd2024.spell.burning_hands
    name: {zh: 燃烧之手, en: Burning Hands}
    level: 1
    school: evocation
    casting: action
    range: self
    components: [v, s]
    duration: instant
    save: dex
    save_effect: half
    area: {shape: cone, feet: 15}
    damage: {type: fire, 1: 3d6}
    upcast: "The damage increases by 1d6 for each spell slot level above 1."
    upcast_dice: {dice: 1d6, above: 1}
    text:
      zh: |-
        15 尺锥形, 2d6 火焰伤害(敏捷豁免减半)。
      en: |-
        A thin sheet of flames shoots forth from you. Each creature in a 15-foot Cone makes a Dexterity saving throw, taking 3d6 Fire damage on a failed save or half as much damage on a successful one. Flammable objects in the Cone that aren't being worn or carried start burning.

  - id: dnd2024.spell.charm_person
    name: {zh: 魅惑人类, en: Charm Person}
    level: 1
    school: enchantment
    casting: action
    range: {feet: 30}
    components: [v, s]
    duration: {kind: time, zh: 1 小时, en: 1 hour}
    save: wis
    upcast: "You can target one additional creature for each spell slot level above 1."
    text:
      zh: |-
        一个人形生物感知豁免失败则被你魅惑 1 小时。
      en: |-
        One Humanoid you can see within range makes a Wisdom saving throw. It does so with Advantage if you or your allies are fighting it. On a failed save, the target has the Charmed condition until the spell ends or until you or your allies damage it. The Charmed creature is Friendly to you. When the spell ends, the target knows it was Charmed by you.

  - id: dnd2024.spell.chromatic_orb
    name: {zh: 色彩球, en: Chromatic Orb}
    level: 1
    school: evocation
    casting: action
    range: {feet: 90}
    components: [v, s, m]
    material: "a diamond worth 50+ GP"
    duration: instant
    attack: ranged
    upcast: "The damage increases by 1d8 for each spell slot level above 1. The orb can leap a maximum number of times equal to the level of the slot expended, and a creature can be targeted only once by each casting of this spell."
    text:
      zh: |-
        3d8 元素伤害(自选类型), 远程法术攻击。
      en: |-
        You hurl an orb of energy at a target within range. Choose Acid, Cold, Fire, Lightning, Poison, or Thunder for the type of orb you create, and then make a ranged spell attack against the target. On a hit, the target takes 3d8 damage of the chosen type. If you roll the same number on two or more of the d8s, the orb leaps to a different target of your choice within 30 feet of the target. Make an attack roll against the new target, and make a new damage roll. The orb can't leap again unless you cast the spell with a level 2+ spell slot.

  - id: dnd2024.spell.color_spray
    name: {zh: 七彩喷射, en: Color Spray}
    level: 1
    school: illusion
    casting: action
    range: self
    components: [v, s, m]
    material: "a pinch of colorful sand"
    duration: instant
    save: con
    area: {shape: cone, feet: 15}
    text:
      zh: |-
        15 尺锥形, 体质豁免失败者目盲至你下回合结束。
      en: |-
        You launch a dazzling array of flashing, colorful light. Each creature in a 15-foot Cone originating from you must succeed on a Constitution saving throw or have the Blinded condition until the end of your next turn.

  - id: dnd2024.spell.command
    name: {zh: 命令术, en: Command}
    level: 1
    school: enchantment
    casting: action
    range: {feet: 60}
    components: [v]
    duration: instant
    save: wis
    upcast: "You can affect one additional creature for each spell slot level above 1."
    text:
      zh: |-
        命令一个生物执行一个词: 来/丢/逃/趴/停等(感知豁免否定)。
      en: |-
        You speak a one-word command to a creature you can see within range. The target must succeed on a Wisdom saving throw or follow the command on its next turn. Choose the command from these options: Approach. The target moves toward you by the shortest and most direct route, ending its turn if it moves within 5 feet of you. Drop. The target drops whatever it is holding and then ends its turn. Flee. The target spends its turn moving away from you by the fastest available means. Grovel. The target has the Prone condition and then ends its turn. Halt. On its turn, the target doesn't move and takes no action or Bonus Action.

  - id: dnd2024.spell.comprehend_languages
    name: {zh: 通晓语言, en: Comprehend Languages}
    level: 1
    school: divination
    casting: action
    range: self
    components: [v, s, m]
    material: "a pinch of soot and salt"
    duration: {kind: time, zh: 1 小时, en: 1 hour}
    ritual: true
    text:
      zh: |-
        1 小时内听懂任何语言, 阅读任何文字。
      en: |-
        For the duration, you understand the literal meaning of any language that you hear or see signed. You also understand any written language that you see, but you must be touching the surface on which the words are written. It takes about 1 minute to read one page of text. This spell doesn't decode symbols or secret messages.

  - id: dnd2024.spell.create_or_destroy_water
    name: {zh: 造水/枯水术, en: Create or Destroy Water}
    level: 1
    school: transmutation
    casting: action
    range: {feet: 30}
    components: [v, s, m]
    material: "a mix of water and sand"
    duration: instant
    area: {shape: cube, feet: 30}
    upcast: "You create or destroy 10 additional gallons of water, or the size of the Cube increases by 5 feet, for each spell slot level above 1."
    text:
      zh: |-
        造出/毁掉 10 加仑水(可扩大)。
      en: |-
        You do one of the following: Create Water. You create up to 10 gallons of clean water within range in an open container. Alternatively, the water falls as rain in a 30-foot Cube within range, extinguishing exposed flames there. Destroy Water. You destroy up to 10 gallons of water in an open container within range. Alternatively, you destroy fog in a 30-foot Cube within range.

  - id: dnd2024.spell.cure_wounds
    name: {zh: 治疗之伤, en: Cure Wounds}
    level: 1
    school: abjuration
    casting: action
    range: touch
    components: [v, s]
    duration: instant
    text:
      zh: |-
        触碰治疗 2d8+施法属性 HP(不死/构装无效)。
      en: |-
        A creature you touch regains a number of Hit Points equal to 2d8 plus your spellcasting ability modifier. Using a Higher-Level Spell Slot. The healing increases by 2d8 for each spell slot level above 1.

  - id: dnd2024.spell.detect_evil_and_good
    name: {zh: 侦测善恶, en: Detect Evil and Good}
    level: 1
    school: divination
    casting: action
    range: self
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    text:
      zh: |-
        专注 10 分钟, 感知 30 尺内异界生物/圣徽/邪祟。
      en: |-
        For the duration, you sense the location of any Aberration, Celestial, Elemental, Fey, Fiend, or Undead within 30 feet of yourself. You also sense whether the Hallow spell is active there and, if so, where. The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.

  - id: dnd2024.spell.detect_magic
    name: {zh: 侦测魔法, en: Detect Magic}
    level: 1
    school: divination
    casting: action
    range: self
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    ritual: true
    text:
      zh: |-
        专注 10 分钟, 感知 30 尺内魔法及其学派。
      en: |-
        For the duration, you sense the presence of magical effects within 30 feet of yourself. If you sense such effects, you can take the Magic action to see a faint aura around any visible creature or object in the area that bears the magic, and if an effect was created by a spell, you learn the spell's school of magic. The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.

  - id: dnd2024.spell.detect_poison_and_disease
    name: {zh: 侦测毒性与疾病, en: Detect Poison and Disease}
    level: 1
    school: divination
    casting: action
    range: self
    components: [v, s, m]
    material: "a yew leaf"
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    ritual: true
    text:
      zh: |-
        感知 30 尺内毒物、疾病与中毒生物。
      en: |-
        For the duration, you sense the location of poisons, poisonous or venomous creatures, and magical contagions within 30 feet of yourself. You sense the kind of poison, creature, or contagion in each case. The spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal; or a thin sheet of lead.

  - id: dnd2024.spell.disguise_self
    name: {zh: 易容术, en: Disguise Self}
    level: 1
    school: illusion
    casting: action
    range: self
    components: [v, s]
    duration: {kind: time, zh: 1 小时, en: 1 hour}
    text:
      zh: |-
        1 小时内改变外貌与衣着(限于同体型)。
      en: |-
        You make yourself-including your clothing, armor, weapons, and other belongings on your personlook different until the spell ends. You can seem 1 foot shorter or taller and can appear heavier or lighter. You must adopt a form that has the same basic arrangement of limbs as you have. Otherwise, the extent of the illusion is up to you. The changes wrought by this spell fail to hold up to physical inspection. For example, if you use this spell to add a hat to your outfit, objects pass through the hat, and anyone who touches it would feel nothing. To discern that you are disguised, a creature must take the Study action to inspect your appearance and succeed on an Intelligence (Investigation) check against your spell save DC.

  - id: dnd2024.spell.dissonant_whispers
    name: {zh: 不谐低语, en: Dissonant Whispers}
    level: 1
    school: enchantment
    casting: action
    range: {feet: 60}
    components: [v]
    duration: instant
    save: wis
    save_effect: half
    damage: {type: psychic, 1: 3d6}
    upcast: "The damage increases by 1d6 for each spell slot level above 1."
    upcast_dice: {dice: 1d6, above: 1}
    text:
      zh: |-
        目标感知豁免失败: 3d6 心灵伤害并用反应逃离。
      en: |-
        One creature of your choice that you can see within range hears a discordant melody in its mind. The target makes a Wisdom saving throw. On a failed save, it takes 3d6 Psychic damage and must immediately use its Reaction, if available, to move as far away from you as it can, using the safest route. On a successful save, the target takes half as much damage only.

  - id: dnd2024.spell.divine_favor
    name: {zh: 神恩, en: Divine Favor}
    level: 1
    school: transmutation
    casting: bonus
    range: self
    components: [v, s]
    duration: {kind: time, zh: 1 分钟, en: 1 minute}
    damage: {type: radiant, 1: 1d4}
    text:
      zh: |-
        1 分钟内你的武器伤害 +1d4 光耀。
      en: |-
        Until the spell ends, your attacks with weapons deal an extra 1d4 Radiant damage on a hit.

  - id: dnd2024.spell.divine_smite
    name: {zh: 至圣斩, en: Divine Smite}
    level: 1
    school: evocation
    casting: bonus
    range: self
    components: []
    duration: instant
    damage: {type: radiant, 1: 2d8}
    upcast: "The damage increases by 1d8 for each spell slot level above 1."
    upcast_dice: {dice: 1d8, above: 1}
    text:
      zh: |-
        命中后消耗法术位追加 2d8 光耀伤害(不死/邪魔 +1d8)。
      en: |-
        The target takes an extra 2d8 Radiant damage from the attack. The damage increases by 1d8 if the target is a Fiend or an Undead.

  - id: dnd2024.spell.ensnaring_strike
    name: {zh: 缠绕打击, en: Ensnaring Strike}
    level: 1
    school: conjuration
    casting: bonus
    range: self
    components: [v]
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: str
    damage: {type: piercing, 1: 1d6}
    upcast: "The damage increases by 1d6 for each spell slot level above 1."
    upcast_dice: {dice: 1d6, above: 1}
    text:
      zh: |-
        命中后目标力量豁免, 失败被藤蔓束缚(专注)。
      en: |-
        As you hit the target, grasping vines appear on it, and it makes a Strength saving throw. A Large or larger creature has Advantage on this save. On a failed save, the target has the Restrained condition until the spell ends. On a successful save, the vines shrivel away, and the spell ends. While Restrained, the target takes 1d6 Piercing damage at the start of each of its turns. The target or a creature within reach of it can take an action to make a Strength (Athletics) check against your spell save DC. On a success, the spell ends.

  - id: dnd2024.spell.entangle
    name: {zh: 纠缠术, en: Entangle}
    level: 1
    school: conjuration
    casting: action
    range: {feet: 90}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: str
    text:
      zh: |-
        20 尺方形地面长出藤蔓, 力量豁免失败被束缚(专注)。
      en: |-
        Grasping plants sprout from the ground in a 20-foot square within range. For the duration, these plants turn the ground in the area into Difficult Terrain. They disappear when the spell ends. Each creature (other than you) in the area when you cast the spell must succeed on a Strength saving throw or have the Restrained condition until the spell ends. A Restrained creature can take an action to make a Strength (Athletics) check against your spell save DC. On a success, it frees itself from the grasping plants and is no longer Restrained by them.

  - id: dnd2024.spell.expeditious_retreat
    name: {zh: 疾走术, en: Expeditious Retreat}
    level: 1
    school: transmutation
    casting: bonus
    range: self
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    text:
      zh: |-
        专注 10 分钟, 可用附赠动作疾走。
      en: |-
        You take the Dash action, and until the spell ends, you can take that action again as a Bonus Action.

  - id: dnd2024.spell.faerie_fire
    name: {zh: 妖火, en: Faerie Fire}
    level: 1
    school: evocation
    casting: action
    range: {feet: 60}
    components: [v]
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: dex
    area: {shape: cube, feet: 20}
    text:
      zh: |-
        20 尺立方内目标敏捷豁免失败则被照亮, 攻击对其优势。
      en: |-
        Objects in a 20-foot Cube within range are outlined in blue, green, or violet light (your choice). Each creature in the Cube is also outlined if it fails a Dexterity saving throw. For the duration, objects and affected creatures shed Dim Light in a 10-foot radius and can't benefit from the Invisible condition. Attack rolls against an affected creature or object have Advantage if the attacker can see it.

  - id: dnd2024.spell.false_life
    name: {zh: 虚假生命, en: False Life}
    level: 1
    school: necromancy
    casting: action
    range: self
    components: [v, s, m]
    material: "a drop of alcohol"
    duration: instant
    upcast: "You gain 5 additional Temporary Hit Points for each spell slot level above 1."
    text:
      zh: |-
        获得 1d4+4 临时 HP, 持续 1 小时。
      en: |-
        You gain 2d4 + 4 Temporary Hit Points.

  - id: dnd2024.spell.feather_fall
    name: {zh: 羽落术, en: Feather Fall}
    level: 1
    school: transmutation
    casting: reaction
    range: {feet: 60}
    components: [v, m]
    material: "a small feather or piece of down"
    duration: {kind: time, zh: 1 分钟, en: 1 minute}
    text:
      zh: |-
        反应: 5 个坠落生物下坠速度降至 60 尺/轮且不受坠落伤害。
      en: |-
        Choose up to five falling creatures within range. A falling creature's rate of descent slows to 60 feet per round until the spell ends. If a creature lands before the spell ends, the creature takes no damage from the fall, and the spell ends for that creature.

  - id: dnd2024.spell.find_familiar
    name: {zh: 寻获魔宠, en: Find Familiar}
    level: 1
    school: conjuration
    casting: {kind: time, zh: 1 小时, en: 1 hour}
    range: {feet: 10}
    components: [v, s, m]
    material: "burning incense worth 10+ GP, which the spell consumes"
    duration: instant
    ritual: true
    text:
      zh: |-
        召唤魔宠(蝙蝠/猫/乌鸦等), 可共享感官、传递触碰法术。
      en: |-
        You gain the service of a familiar, a spirit that takes an animal form you choose: Bat, Cat, Frog, Hawk, Lizard, Octopus, Owl, Rat, Raven, Spider, Weasel, or another Beast that has a Challenge Rating of 0. Appearing in an unoccupied space within range, the familiar has the statistics of the chosen form (see "Monsters"), though it is a Celestial, Fey, or Fiend (your choice) instead of a Beast. Your familiar acts independently of you, but it obeys your commands. Telepathic Connection. While your familiar is within 100 feet of you, you can communicate with it telepathically. Additionally, as a Bonus Action, you can see through the familiar's eyes and hear what it hears until the start of your next turn, gaining the benefits of any special senses it has. Finally, when you cast a spell with a range of touch, your familiar can deliver the touch. Your familiar must be within 100 feet of you, and it must take a Reaction to deliver the touch when you cast the spell. Combat. The familiar is an ally to you and your allies. It rolls its own Initiative and acts on its own turn. A familiar can't attack, but it can take other actions as normal. Disappearance of the Familiar. When the familiar drops to 0 Hit Points, it disappears. It reappears after you cast this spell again. As a Magic action, you can temporarily dismiss the familiar to a pocket dimension. Alternatively, you can dismiss it forever. As a Magic action while it is temporarily dismissed, you can cause it to reappear in an unoccupied space within 30 feet of you. Whenever the familiar drops to 0 Hit Points or disappears into the pocket dimension, it leaves behind in its space anything it was wearing or carrying. One Familiar Only. You can't have more than one familiar at a time. If you cast this spell while you have a familiar, you instead cause it to adopt a new eligible form.

  - id: dnd2024.spell.floating_disk
    name: {zh: 浮空碟, en: Floating Disk}
    level: 1
    school: conjuration
    casting: action
    range: {feet: 30}
    components: [v, s, m]
    material: "a drop of mercury"
    duration: {kind: time, zh: 1 小时, en: 1 hour}
    ritual: true
    text:
      zh: |-
        造出跟随你的浮空碟, 载重 500 磅, 持续 1 小时。
      en: |-
        This spell creates a circular, horizontal plane of force, 3 feet in diameter and 1 inch thick, that floats 3 feet above the ground in an unoccupied space of your choice that you can see within range. The disk remains for the duration and can hold up to 500 pounds. If more weight is placed on it, the spell ends, and everything on the disk falls to the ground. The disk is immobile while you are within 20 feet of it. If you move more than 20 feet away from it, the disk follows you so that it remains within 20 feet of you. It can move across uneven terrain, up or down stairs, slopes and the like, but it can't cross an elevation change of 10 feet or more. For example, the disk can't move across a 10-foot-deep pit, nor could it leave such a pit if it was created at the bottom. If you move more than 100 feet from the disk (typically because it can't move around an obstacle to follow you), the spell ends.

  - id: dnd2024.spell.fog_cloud
    name: {zh: 云雾术, en: Fog Cloud}
    level: 1
    school: conjuration
    casting: action
    range: {feet: 120}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 1 小时, en: up to 1 hour}
    concentration: true
    area: {shape: sphere, feet: 20}
    upcast: "The fog's radius increases by 20 feet for each spell slot level above 1."
    text:
      zh: |-
        20 尺半径浓雾, 重度遮蔽, 持续 1 小时(专注)。
      en: |-
        You create a 20-foot-radius Sphere of fog centered on a point within range. The Sphere is Heavily Obscured. It lasts for the duration or until a strong wind (such as one created by Gust of Wind) disperses it.

  - id: dnd2024.spell.goodberry
    name: {zh: 神莓术, en: Goodberry}
    level: 1
    school: conjuration
    casting: action
    range: self
    components: [v, s, m]
    material: "a sprig of mistletoe"
    duration: {kind: time, zh: 24 小时, en: 24 hours}
    text:
      zh: |-
        造出 10 颗莓果, 每颗回复 1 HP 并提供一日营养。
      en: |-
        Ten berries appear in your hand and are infused with magic for the duration. A creature can take a Bonus Action to eat one berry. Eating a berry restores 1 Hit Point, and the berry provides enough nourishment to sustain a creature for one day. Uneaten berries disappear when the spell ends.

  - id: dnd2024.spell.grease
    name: {zh: 油腻术, en: Grease}
    level: 1
    school: conjuration
    casting: action
    range: {feet: 60}
    components: [v, s, m]
    material: "a bit of pork rind or butter"
    duration: {kind: time, zh: 1 分钟, en: 1 minute}
    save: dex
    text:
      zh: |-
        10 尺方形地面变滑, 敏捷豁免失败倒地。
      en: |-
        Nonflammable grease covers the ground in a 10foot square centered on a point within range and turns it into Difficult Terrain for the duration. When the grease appears, each creature standing in its area must succeed on a Dexterity saving throw or have the Prone condition. A creature that enters the area or ends its turn there must also succeed on that save or fall Prone.

  - id: dnd2024.spell.guiding_bolt
    name: {zh: 指引之光, en: Guiding Bolt}
    level: 1
    school: evocation
    casting: action
    range: {feet: 120}
    components: [v, s]
    duration: {kind: time, zh: 1 轮, en: 1 round}
    attack: ranged
    damage: {type: radiant, 1: 4d6}
    upcast: "The damage increases by 1d6 for each spell slot level above 1."
    upcast_dice: {dice: 1d6, above: 1}
    text:
      zh: |-
        远程法术攻击, 4d6 光耀, 下次对该目标攻击优势。
      en: |-
        You hurl a bolt of light toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 4d6 Radiant damage, and the next attack roll made against it before the end of your next turn has Advantage.

  - id: dnd2024.spell.healing_word
    name: {zh: 治愈真言, en: Healing Word}
    level: 1
    school: abjuration
    casting: bonus
    range: {feet: 60}
    components: [v]
    duration: instant
    upcast: "The healing increases by 2d4 for each spell slot level above 1."
    text:
      zh: |-
        附赠动作, 60 尺内治疗 2d4+施法属性 HP。
      en: |-
        A creature of your choice that you can see within range regains Hit Points equal to 2d4 plus your spellcasting ability modifier.

  - id: dnd2024.spell.hellish_rebuke
    name: {zh: 炼狱叱喝, en: Hellish Rebuke}
    level: 1
    school: evocation
    casting: reaction
    range: {feet: 60}
    components: [v, s]
    duration: instant
    save: dex
    save_effect: half
    damage: {type: fire, 1: 2d10}
    upcast: "The damage increases by 1d10 for each spell slot level above 1."
    upcast_dice: {dice: 1d10, above: 1}
    text:
      zh: |-
        反应: 受到伤害时反伤 2d10 火焰(敏捷豁免减半)。
      en: |-
        The creature that damaged you is momentarily surrounded by green flames. It makes a Dexterity saving throw, taking 2d10 Fire damage on a failed save or half as much damage on a successful one.

  - id: dnd2024.spell.heroism
    name: {zh: 英雄气概, en: Heroism}
    level: 1
    school: enchantment
    casting: action
    range: touch
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    upcast: "You can target one additional creature for each spell slot level above 1."
    text:
      zh: |-
        专注 1 分钟, 目标免疫恐慌并获得每回合临时 HP。
      en: |-
        A willing creature you touch is imbued with bravery. Until the spell ends, the creature is immune to the Frightened condition and gains Temporary Hit Points equal to your spellcasting ability modifier at the start of each of its turns.

  - id: dnd2024.spell.hex
    name: {zh: 脆弱诅咒, en: Hex}
    level: 1
    school: enchantment
    casting: bonus
    range: {feet: 90}
    components: [v, s, m]
    material: "the petrified eye of a newt"
    duration: {kind: time, zh: 专注，最多 1 小时, en: up to 1 hour}
    concentration: true
    damage: {type: necrotic, 1: 1d6}
    upcast: "Your Concentration can last longer with a spell slot of level 2 (up to 4 hours), 3-4 (up to 8 hours), or 5+ (24 hours)."
    text:
      zh: |-
        专注 1 小时, 你的攻击对目标 +1d6 黯蚀, 目标某项检定劣势。
      en: |-
        You place a curse on a creature that you can see within range. Until the spell ends, you deal an extra 1d6 Necrotic damage to the target whenever you hit it with an attack roll. Also, choose one ability when you cast the spell. The target has Disadvantage on ability checks made with the chosen ability. If the target drops to 0 Hit Points before this spell ends, you can take a Bonus Action on a later turn to curse a new creature.

  - id: dnd2024.spell.hideous_laughter
    name: {zh: 狂笑术, en: Hideous Laughter}
    level: 1
    school: enchantment
    casting: action
    range: {feet: 30}
    components: [v, s, m]
    material: "a tart and a feather"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: wis
    upcast: "You can target one additional creature for each spell slot level above 1."
    text:
      zh: |-
        目标感知豁免失败则倒地狂笑, 无法行动(专注)。
      en: |-
        One creature of your choice that you can see within range makes a Wisdom saving throw. On a failed save, it has the Prone and Incapacitated conditions for the duration. During that time, it laughs uncontrollably if it's capable of laughter, and it can't end the Prone condition on itself. At the end of each of its turns and each time it takes damage, it makes another Wisdom saving throw. The target has Advantage on the save if the save is triggered by damage. On a successful save, the spell ends.

  - id: dnd2024.spell.hunters_mark
    name: {zh: 猎人印记, en: Hunter's Mark}
    level: 1
    school: divination
    casting: bonus
    range: {feet: 90}
    components: [v]
    duration: {kind: time, zh: 专注，最多 1 小时, en: up to 1 hour}
    concentration: true
    damage: {type: force, 1: 1d6}
    upcast: "Your Concentration can last longer with a spell slot of level 3-4 (up to 8 hours) or 5+ (up to 24 hours)."
    text:
      zh: |-
        专注 1 小时, 对目标攻击 +1d6 伤害, 便于追踪。
      en: |-
        You magically mark one creature you can see within range as your quarry. Until the spell ends, you deal an extra 1d6 Force damage to the target whenever you hit it with an attack roll. You also have Advantage on any Wisdom (Perception or Survival) check you make to find it. If the target drops to 0 Hit Points before this spell ends, you can take a Bonus Action to move the mark to a new creature you can see within range.

  - id: dnd2024.spell.ice_knife
    name: {zh: 冰刃, en: Ice Knife}
    level: 1
    school: conjuration
    casting: action
    range: {feet: 60}
    components: [s, m]
    material: "a drop of water or a piece of ice"
    duration: instant
    save: dex
    attack: ranged
    damage: {type: piercing, 1: 1d10}
    upcast: "The Cold damage increases by 1d6 for each spell slot level above 1."
    upcast_dice: {dice: 1d6, above: 1}
    text:
      zh: |-
        1d10 穿刺 + 爆炸 2d6 寒冷(敏捷豁免)。
      en: |-
        You create a shard of ice and fling it at one creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 Piercing damage. Hit or miss, the shard then explodes. The target and each creature within 5 feet of it must succeed on a Dexterity saving throw or take 2d6 Cold damage.

  - id: dnd2024.spell.identify
    name: {zh: 鉴定术, en: Identify}
    level: 1
    school: divination
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: touch
    components: [v, s, m]
    material: "a pearl worth 100+ GP"
    duration: instant
    ritual: true
    text:
      zh: |-
        辨识魔法物品的属性、用途与是否受诅咒。
      en: |-
        You touch an object throughout the spell's casting. If the object is a magic item or some other magical object, you learn its properties and how to use them, whether it requires Attunement, and how many charges it has, if any. You learn whether any ongoing spells are affecting the item and what they are. If the item was created by a spell, you learn that spell's name. If you instead touch a creature throughout the casting, you learn which ongoing spells, if any, are currently affecting it.

  - id: dnd2024.spell.illusory_script
    name: {zh: 幻影文字, en: Illusory Script}
    level: 1
    school: illusion
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: touch
    components: [s, m]
    material: "ink worth 10+ GP, which the spell consumes"
    duration: {kind: time, zh: 10 天, en: 10 days}
    ritual: true
    text:
      zh: |-
        写下一段只有指定对象能读的文字, 其余人看到的是乱码。
      en: |-
        You write on parchment, paper, or another suitable material and imbue it with an illusion that lasts for the duration. To you and any creatures you designate when you cast the spell, the writing appears normal, seems to be written in your hand, and conveys whatever meaning you intended when you wrote the text. To all others, the writing appears as if it were written in an unknown or magical script that is unintelligible. Alternatively, the illusion can alter the meaning, handwriting, and language of the text, though the language must be one you know. If the spell is dispelled, the original script and the illusion both disappear. A creature that has Truesight can read the hidden message.

  - id: dnd2024.spell.inflict_wounds
    name: {zh: 致伤术, en: Inflict Wounds}
    level: 1
    school: necromancy
    casting: action
    range: touch
    components: [v, s]
    duration: instant
    save: con
    save_effect: half
    damage: {type: necrotic, 1: 2d10}
    upcast: "The damage increases by 1d10 for each spell slot level above 1."
    upcast_dice: {dice: 1d10, above: 1}
    text:
      zh: |-
        近战法术攻击, 2d10 黯蚀伤害。
      en: |-
        A creature you touch makes a Constitution saving throw, taking 2d10 Necrotic damage on a failed save or half as much damage on a successful one.

  - id: dnd2024.spell.jump
    name: {zh: 跳跃术, en: Jump}
    level: 1
    school: transmutation
    casting: bonus
    range: touch
    components: [v, s, m]
    material: "a grasshopper's hind leg"
    duration: {kind: time, zh: 1 分钟, en: 1 minute}
    upcast: "You can target one additional creature for each spell slot level above 1."
    text:
      zh: |-
        目标跳跃距离变为三倍, 持续 1 分钟。
      en: |-
        You touch a willing creature. Once on each of its turns until the spell ends, that creature can jump up to 30 feet by spending 10 feet of movement.

  - id: dnd2024.spell.longstrider
    name: {zh: 大步奔行, en: Longstrider}
    level: 1
    school: transmutation
    casting: action
    range: touch
    components: [v, s, m]
    material: "a pinch of dirt"
    duration: {kind: time, zh: 1 小时, en: 1 hour}
    upcast: "You can target one additional creature for each spell slot level above 1."
    text:
      zh: |-
        目标速度 +10 尺, 持续 1 小时。
      en: |-
        You touch a creature. The target's Speed increases by 10 feet until the spell ends.

  - id: dnd2024.spell.mage_armor
    name: {zh: 法师护甲, en: Mage Armor}
    level: 1
    school: abjuration
    casting: action
    range: touch
    components: [v, s, m]
    material: "a piece of cured leather"
    duration: {kind: time, zh: 8 小时, en: 8 hours}
    text:
      zh: |-
        无甲时 AC 变为 13+敏捷, 持续 8 小时。
      en: |-
        You touch a willing creature who isn't wearing armor. Until the spell ends, the target's base AC becomes 13 plus its Dexterity modifier. The spell ends early if the target dons armor.

  - id: dnd2024.spell.magic_missile
    name: {zh: 魔法飞弹, en: Magic Missile}
    level: 1
    school: evocation
    casting: action
    range: {feet: 120}
    components: [v, s]
    duration: instant
    upcast: "The spell creates one more dart for each spell slot level above 1."
    text:
      zh: |-
        3 支必中飞弹, 每支 1d4+1 力场伤害(可分散或集中)。
      en: |-
        You create three glowing darts of magical force. Each dart strikes a creature of your choice that you can see within range. A dart deals 1d4 + 1 Force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several.

  - id: dnd2024.spell.protection_from_evil_and_good
    name: {zh: 防护善恶, en: Protection from Evil and Good}
    level: 1
    school: abjuration
    casting: action
    range: touch
    components: [v, s, m]
    material: "a flask of Holy Water worth 25+, GP, which the spell consumes"
    duration: {kind: time, zh: 专注，最多 10 分钟, en: Concentration up to 10 minutes}
    text:
      zh: |-
        专注 10 分钟, 异界生物对你攻击劣势, 免疫其魅惑/恐慌。
      en: |-
        Until the spell ends, one willing creature you touch is protected against creatures that are Aberrations, Celestials, Elementals, Fey, Fiends, or Undead. The protection grants several benefits. Creatures of those types have Disadvantage on attack rolls against the target. The target also can't be possessed by or gain the Charmed or Frightened conditions from them. If the target is already possessed, Charmed, or Frightened by such a creature, the target has Advantage on any new saving throw against the relevant effect.

  - id: dnd2024.spell.purify_food_and_drink
    name: {zh: 净化食粮, en: Purify Food and Drink}
    level: 1
    school: transmutation
    casting: action
    range: {feet: 10}
    components: [v, s]
    duration: instant
    ritual: true
    area: {shape: sphere, feet: 5}
    text:
      zh: |-
        净化 5 尺半径内的食物与饮水。
      en: |-
        You remove poison and rot from nonmagical food and drink in a 5-foot-radius Sphere centered on a point within range.

  - id: dnd2024.spell.ray_of_sickness
    name: {zh: 致病射线, en: Ray of Sickness}
    level: 1
    school: necromancy
    casting: action
    range: {feet: 60}
    components: [v, s]
    duration: instant
    attack: ranged
    damage: {type: poison, 1: 2d8}
    text:
      zh: |-
        远程法术攻击, 2d8 毒素并使目标中毒。
      en: |-
        You shoot a greenish ray at a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 2d8 Poison damage and has the Poisoned condition until the end of your next turn. Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 1.

  - id: dnd2024.spell.sanctuary
    name: {zh: 圣域术, en: Sanctuary}
    level: 1
    school: abjuration
    casting: bonus
    range: {feet: 30}
    components: [v, s, m]
    material: "a shard of glass from a mirror"
    duration: {kind: time, zh: 1 分钟, en: 1 minute}
    save: wis
    text:
      zh: |-
        1 分钟内攻击你的人需感知豁免, 失败则改选目标。
      en: |-
        You ward a creature within range. Until the spell ends, any creature who targets the warded creature with an attack roll or a damaging spell must succeed on a Wisdom saving throw or either choose a new target or lose the attack or spell. This spell doesn't protect the warded creature from areas of effect. The spell ends if the warded creature makes an attack roll, casts a spell, or deals damage.

  - id: dnd2024.spell.searing_smite
    name: {zh: 灼热斩, en: Searing Smite}
    level: 1
    school: evocation
    casting: bonus
    range: self
    components: []
    duration: {kind: time, zh: 1 分钟, en: 1 minute}
    save: con
    damage: {type: fire, 1: 1d6}
    upcast: "All the damage increases by 1d6 for each spell slot level above 1."
    upcast_dice: {dice: 1d6, above: 1}
    text:
      zh: |-
        命中后追加 1d6 火焰, 并每回合持续燃烧(专注)。
      en: |-
        As you hit the target, it takes an extra 1d6 Fire damage from the attack. At the start of each of its turns until the spell ends, the target takes 1d6 Fire damage and then makes a Constitution saving throw. On a failed save, the spell continues. On a successful save, the spell ends.

  - id: dnd2024.spell.shield
    name: {zh: 护盾术, en: Shield}
    level: 1
    school: abjuration
    casting: reaction
    range: self
    components: [v, s]
    duration: {kind: time, zh: 1 轮, en: 1 round}
    text:
      zh: |-
        反应: AC +5 直到你下回合开始。
      en: |-
        An imperceptible barrier of magical force protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from Magic Missile.

  - id: dnd2024.spell.shield_of_faith
    name: {zh: 信仰之盾, en: Shield of Faith}
    level: 1
    school: abjuration
    casting: bonus
    range: {feet: 60}
    components: [v, s, m]
    material: "a prayer scroll"
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    text:
      zh: |-
        专注 10 分钟, 目标 AC +2。
      en: |-
        A shimmering field surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration.

  - id: dnd2024.spell.silent_image
    name: {zh: 无声幻影, en: Silent Image}
    level: 1
    school: illusion
    casting: action
    range: {feet: 60}
    components: [v, s, m]
    material: "a bit of fleece"
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    area: {shape: cube, feet: 15}
    text:
      zh: |-
        造出 15 尺立方的视觉幻影(无声), 可用动作移动。
      en: |-
        You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot Cube. The image appears at a spot within range and lasts for the duration. The image is purely visual; it isn't accompanied by sound, smell, or other sensory effects. As a Magic action, you can cause the image to move to any spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking. Physical interaction with the image reveals it to be an illusion, since things can pass through it. A creature that takes a Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image.

  - id: dnd2024.spell.sleep
    name: {zh: 睡眠术, en: Sleep}
    level: 1
    school: enchantment
    casting: action
    range: {feet: 60}
    components: [v, s, m]
    material: "a pinch of sand or rose petals"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: wis
    area: {shape: sphere, feet: 5}
    text:
      zh: |-
        5 尺半径内生物感知豁免失败则陷入沉睡(专注 1 分钟)。
      en: |-
        Each creature of your choice in a 5-foot-radius Sphere centered on a point within range must succeed on a Wisdom saving throw or have the Incapacitated condition until the end of its next turn, at which point it must repeat the save. If the target fails the second save, the target has the Unconscious condition for the duration. The spell ends on a target if it takes damage or someone within 5 feet of it takes an action to shake it out of the spell's effect. Creatures that don't sleep, such as elves, or that have Immunity to the Exhaustion condition automatically succeed on saves against this spell.

  - id: dnd2024.spell.speak_with_animals
    name: {zh: 动物交谈, en: Speak with Animals}
    level: 1
    school: divination
    casting: action
    range: self
    components: [v, s]
    duration: {kind: time, zh: 10 分钟, en: 10 minutes}
    ritual: true
    text:
      zh: |-
        1 小时内与野兽交谈, 可影响其行为。
      en: |-
        For the duration, you can comprehend and verbally communicate with Beasts, and you can use any of the Influence action's skill options with them. Most Beasts have little to say about topics that don't pertain to survival or companionship, but at minimum, a Beast can give you information about nearby locations and monsters, including whatever it has perceived within the past day.

  - id: dnd2024.spell.thunderwave
    name: {zh: 雷鸣波, en: Thunderwave}
    level: 1
    school: evocation
    casting: action
    range: self
    components: [v, s]
    duration: instant
    save: con
    save_effect: half
    area: {shape: cube, feet: 15}
    damage: {type: thunder, 1: 2d8}
    text:
      zh: |-
        15 尺立方, 2d8 雷鸣并推开 10 尺(体质豁免减半)。
      en: |-
        You unleash a wave of thunderous energy. Each creature in a 15-foot Cube originating from you makes a Constitution saving throw. On a failed save, a creature takes 2d8 Thunder damage and is pushed 10 feet away from you. On a successful save, a creature takes half as much damage only. In addition, unsecured objects that are entirely within the Cube are pushed 10 feet away from you, and a thunderous boom is audible within 300 feet. Using a Higher-Level Spell Slot. The damage increases by 1d8 for each spell slot level above 1.

  - id: dnd2024.spell.unseen_servant
    name: {zh: 隐形仆役, en: Unseen Servant}
    level: 1
    school: conjuration
    casting: action
    range: {feet: 60}
    components: [v, s, m]
    material: "a bit of string and of wood"
    duration: {kind: time, zh: 1 小时, en: 1 hour}
    ritual: true
    text:
      zh: |-
        召唤隐形仆役, 可做简单劳务, 持续 1 小时。
      en: |-
        This spell creates an Invisible, mindless, shapeless, Medium force that performs simple tasks at your command until the spell ends. The servant springs into existence in an unoccupied space on the ground within range. It has AC 10, 1 Hit Point, and a Strength of 2, and it can't attack. If it drops to 0 Hit Points, the spell ends. Once on each of your turns as a Bonus Action, you can mentally command the servant to move up to 15 feet and interact with an object. The servant can perform simple tasks that a human could do, such as fetching things, cleaning, mending, folding clothes, lighting fires, serving food, and pouring drinks. Once you give the command, the servant performs the task to the best of its ability until it completes the task, then waits for your next command. If you command the servant to perform a task that would move it more than 60 feet away from you, the spell ends.
