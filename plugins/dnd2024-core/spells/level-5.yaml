# 由 tools/gen_spells.py 从 data/raw/spells.json + dnd55e_spells.json 生成。
# 第 5 环，共 38 条。重跑生成器会覆盖；要长期改动请改数据源。
# 没有结构化伤害的法术（控制类）只登记规则原文，damage 留空 —— 不猜。
  - id: dnd2024.spell.animate_objects
    name: {zh: 活化物件, en: Animate Objects}
    level: 5
    school: transmutation
    casting: action
    range: {feet: 120}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    upcast: "The creature's Slam damage increases by 1d4 (Medium or smaller), 1d6 (Large), or 1d12 (Huge) for each spell slot level above 5. Huge or Smaller Construct, Unaligned AC 15 HP 10 (Medium or smaller), 20 (Large), 40 (Huge) Speed 30 ft. MOD SAVE MOD SAVE MOD SAVE Str 16 +3 +3 dex 10 +0 +0 con 10 +0 +0 int 3 -4 -4 WiS 3 -4 -4 chA 1 -5 -5 Immunities Poison, Psychic; Charmed, Exhaustion, Frightened, Paralyzed, Poisoned Senses Blindsight 30 ft.; Passive Perception 6 Languages Understands the languages you know CR None (XP 0; PB equals your Proficiency Bonus) Actions Slam. Melee Attack Roll: Bonus equals your spell attack modifier, reach 5 ft. Hit: Force damage equal to 1d4 + 3 (Medium or smaller), 2d6 + 3 + your spellcasting ability modifier (Large), or 2d12 + 3 + your spellcasting ability modifier (Huge)."
    text:
      zh: |-
        活化至多 10 件小物件为你作战(专注 1 分钟)。
      en: |-
        Objects animate at your command. Choose a number of nonmagical objects within range that aren't being worn or carried, aren't fixed to a surface, and aren't Gargantuan. The maximum number of objects is equal to your spellcasting ability modifier; for this number, a Medium or smaller target counts as one object, a Large target counts as two, and a Huge target counts as three. Each target animates, sprouts legs, and becomes a Construct that uses the Animated Object stat block; this creature is under your control until the spell ends or until it is reduced to 0 Hit Points. Each creature you make with this spell is an ally to you and your allies. In combat, it shares your Initiative count and takes its turn immediately after yours. Until the spell ends, you can take a Bonus Action to mentally command any creature you made with this spell if the creature is within 500 feet of you (if you control multiple creatures, you can command any of them at the same time, issuing the same command to each one). If you issue no commands, the creature takes the Dodge action and moves only to avoid harm. When the creature drops to 0 Hit Points, it reverts to its object form, and any remaining damage carries over to that form.

  - id: dnd2024.spell.antilife_shell
    name: {zh: 反生命外壳, en: Antilife Shell}
    level: 5
    school: abjuration
    casting: action
    range: self
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 1 小时, en: up to 1 hour}
    concentration: true
    area: {shape: emanation, feet: 10}
    text:
      zh: |-
        10 尺半径屏障, 生物无法进入(专注 1 小时)。
      en: |-
        An aura extends from you in a 10-foot Emanation for the duration. The aura prevents creatures other than Constructs and Undead from passing or reaching through it. An affected creature can cast spells or make attacks with Ranged or Reach weapons through the barrier. If you move so that an affected creature is forced to pass through the barrier, the spell ends.

  - id: dnd2024.spell.arcane_hand
    name: {zh: 奥术之手, en: Arcane Hand}
    level: 5
    school: evocation
    casting: action
    range: {feet: 120}
    components: [v, s, m]
    material: "an eggshell and a glove"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: str
    attack: melee
    damage: {type: force, 5: 5d8}
    upcast: "The damage of the Clenched Fist increases by 2d8 and the damage of the Grasping Hand increases by 2d6 for each spell slot level above 5."
    text:
      zh: |-
        造出巨大的力场手, 可抓握/推击(专注 1 分钟)。
      en: |-
        You create a Large hand of shimmering magical energy in an unoccupied space that you can see within range. The hand lasts for the duration, and it moves at your command, mimicking the movements of your own hand. The hand is an object that has AC 20 and Hit Points equal to your Hit Point maximum. If it drops to 0 Hit Points, the spell ends. The hand doesn't occupy its space. When you cast the spell and as a Bonus Action on your later turns, you can move the hand up to 60 feet and then cause one of the following effects: Clenched Fist. The hand strikes a target within 5 feet of it. Make a melee spell attack. On a hit, the target takes 5d8 Force damage. Forceful Hand. The hand attempts to push a Huge or smaller creature within 5 feet of it. The target must succeed on a Strength saving throw, or the hand pushes the target up to 5 feet plus a number of feet equal to five times your spellcasting ability modifier. The hand moves with the target, remaining within 5 feet of it. Grasping Hand. The hand attempts to grapple a Huge or smaller creature within 5 feet of it. The target must succeed on a Dexterity saving throw, or the target has the Grappled condition, with an escape DC equal to your spell save DC. While the hand grapples the target, you can take a Bonus Action to cause the hand to crush it, dealing Bludgeoning damage to the target equal to 4d6 plus your spellcasting ability modifier. Interposing Hand. The hand grants you Half Cover against attacks and other effects that originate from its space or that pass through it. In addition, its space counts as Difficult Terrain for your enemies.

  - id: dnd2024.spell.awaken
    name: {zh: 启蒙术, en: Awaken}
    level: 5
    school: transmutation
    casting: {kind: time, zh: 8 小时, en: 8 hours}
    range: touch
    components: [v, s, m]
    material: "an agate worth 1,000+ GP, which the spell consumes"
    duration: instant
    text:
      zh: |-
        赋予野兽/植物智力与语言, 持续 30 天。
      en: |-
        You spend the casting time tracing magical pathways within a precious gemstone, and then touch the target. The target must be either a Beast or Plant creature with an Intelligence of 3 or less or a natural plant that isn't a creature. The target gains an Intelligence of 10 and the ability to speak one language you know. If the target is a natural plant, it becomes a Plant creature and gains the ability to move its limbs, roots, vines, creepers, and so forth, and it gains senses similar to a human's. The GM chooses statistics appropriate for the awakened Plant, such as the statistics for the Awakened Shrub or Awakened Tree in "Monsters." The awakened target has the Charmed condition for 30 days or until you or your allies deal damage to it. When that condition ends, the awakened creature chooses its attitude toward you.

  - id: dnd2024.spell.cloudkill
    name: {zh: 死亡之云, en: Cloudkill}
    level: 5
    school: conjuration
    casting: action
    range: {feet: 120}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    save: con
    area: {shape: sphere, feet: 20}
    damage: {type: poison, 5: 5d8}
    upcast: "The damage increases by 1d8 for each spell slot level above 5."
    text:
      zh: |-
        20 尺半径毒云, 体质豁免失败受 5d8 毒素伤害(专注 10 分钟)。
      en: |-
        You create a 20-foot-radius Sphere of yellow-green fog centered on a point within range. The fog lasts for the duration or until strong wind (such as the one created by Gust of Wind) disperses it, ending the spell. Its area is Heavily Obscured. Each creature in the Sphere makes a Constitution saving throw, taking 5d8 Poison damage on a failed save or half as much damage on a successful one. A creature must also make this save when the Sphere moves into its space and when it enters the Sphere or ends its turn there. A creature makes this save only once per turn. The Sphere moves 10 feet away from you at the start of each of your turns.

  - id: dnd2024.spell.commune
    name: {zh: 通神术, en: Commune}
    level: 5
    school: divination
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: self
    components: [v, s, m]
    material: "incense"
    duration: {kind: time, zh: 1 分钟, en: 1 minute}
    ritual: true
    text:
      zh: |-
        向神祇问 3 个是非问题。
      en: |-
        You contact a deity or a divine proxy and ask up to three questions that can be answered with yes or no. You must ask your questions before the spell ends. You receive a correct answer for each question. Divine beings aren't necessarily omniscient, so you might receive "unclear" as an answer if a question pertains to information that lies beyond the deity's knowledge. In a case where a one-word answer could be misleading or contrary to the deity's interests, the GM might offer a short phrase as an answer instead. If you cast the spell more than once before finishing a Long Rest, there is a cumulative 25 percent chance for each casting after the first that you get no answer.

  - id: dnd2024.spell.commune_with_nature
    name: {zh: 自然通神, en: Commune with Nature}
    level: 5
    school: divination
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: self
    components: [v, s]
    duration: instant
    ritual: true
    text:
      zh: |-
        获取 3 里内地形/生物/建筑的情报。
      en: |-
        You commune with nature spirits and gain knowledge of the surrounding area. In the outdoors, the spell gives you knowledge of the area within 3 miles of you. In caves and other natural underground settings, the radius is limited to 300 feet. The spell doesn't function where nature has been replaced by construction, such as in castles and settlements. Choose three of the following facts; you learn those facts as they pertain to the spell's area: • Locations of settlements • Locations of portals to other planes of existence • Location of one Challenge Rating 10+ creature (GM's choice) that is a Celestial, an Elemental, a Fey, a Fiend, or an Undead • The most prevalent kind of plant, mineral, or Beast (you choose which to learn) • Locations of bodies of water For example, you could determine the location of a powerful monster in the area, the locations of bodies of water, and the locations of any towns.

  - id: dnd2024.spell.cone_of_cold
    name: {zh: 寒冰锥, en: Cone of Cold}
    level: 5
    school: evocation
    casting: action
    range: self
    components: [v, s, m]
    material: "a small crystal or glass cone"
    duration: instant
    save: con
    area: {shape: cone, feet: 60}
    damage: {type: cold, 5: 8d8}
    upcast: "The damage increases by 1d8 for each spell slot level above 5."
    text:
      zh: |-
        60 尺锥形, 8d8 寒冷伤害(体质豁免减半)。
      en: |-
        You unleash a blast of cold air. Each creature in a 60-foot Cone originating from you makes a Constitution saving throw, taking 8d8 Cold damage on a failed save or half as much damage on a successful one. A creature killed by this spell becomes a frozen statue until it thaws.

  - id: dnd2024.spell.conjure_elemental
    name: {zh: 召唤元素, en: Conjure Elemental}
    level: 5
    school: conjuration
    casting: action
    range: {feet: 60}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    save: dex
    upcast: "The damage increases by 1d8 for each spell slot level above 5."
    text:
      zh: |-
        召唤元素生物为你作战(专注 1 小时)。
      en: |-
        You conjure a Large, intangible spirit from the Elemental Planes that appears in an unoccupied space within range. Choose the spirit's element, which determines its damage type: air (Lightning), earth (Thunder), fire (Fire), or water (Cold). The spirit lasts for the duration. Whenever a creature you can see enters the spirit's space or starts its turn within 5 feet of the spirit, you can force that creature to make a Dexterity saving throw if the spirit has no creature Restrained. On failed save, the target takes 8d8 damage of the spirit's type, and the target has the Restrained condition until the spell ends. At the start of each of its turns, the Restrained target repeats the save. On a failed save, the target takes 4d8 damage of the spirit's type. On a successful save, the target isn't Restrained by the spirit.

  - id: dnd2024.spell.contact_other_plane
    name: {zh: 异界接触, en: Contact Other Plane}
    level: 5
    school: divination
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: self
    components: [v]
    duration: {kind: time, zh: 1 分钟, en: 1 minute}
    ritual: true
    save: int
    damage: {type: psychic, 5: 6d6}
    text:
      zh: |-
        向异界存在问 5 个问题, 有智力受损风险。
      en: |-
        You mentally contact a demigod, the spirit of a longdead sage, or some other knowledgeable entity from another plane. Contacting this otherworldly intelligence can break your mind. When you cast this spell, make a DC 15 Intelligence saving throw. On a successful save, you can ask the entity up to five questions. You must ask your questions before the spell ends. The GM answers each question with one word, such as "yes," "no," "maybe," "never," "irrelevant," or "unclear" (if the entity doesn't know the answer to the question). If a one-word answer would be misleading, the GM might instead offer a short phrase as an answer. On a failed save, you take 6d6 Psychic damage and have the Incapacitated condition until you finish a Long Rest. A Greater Restoration spell cast on you ends this effect.

  - id: dnd2024.spell.contagion
    name: {zh: 疫病术, en: Contagion}
    level: 5
    school: necromancy
    casting: action
    range: touch
    components: []
    duration: {kind: time, zh: 7 天, en: 7 days}
    save: con
    damage: {type: necrotic, 5: 11d8}
    text:
      zh: |-
        使目标感染疾病(体质豁免失败)。
      en: |-
        Your touch inflicts a magical contagion. The target must succeed on a Constitution saving throw or take 11d8 Necrotic damage and have the Poisoned condition. Also, choose one ability when you cast the spell. While Poisoned, the target has Disadvantage on saving throws made with the chosen ability. The target must repeat the saving throw at the end of each of its turns until it gets three successes or failures. If the target succeeds on three of these saves, the spell ends on the target. If the target fails three of the saves, the spell lasts for 7 days on it. Whenever the Poisoned target receives an effect that would end the Poisoned condition, the target must succeed on a Constitution saving throw, or the Poisoned condition doesn't end on it.

  - id: dnd2024.spell.creation
    name: {zh: 创造术, en: Creation}
    level: 5
    school: illusion
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: {feet: 30}
    components: [v, s, m]
    material: "a paintbrush"
    duration: {kind: special, zh: 特殊, en: Special}
    area: {shape: cube, feet: 5}
    upcast: "The Cube increases by 5 feet for each spell slot level above 5."
    text:
      zh: |-
        造出不超过 5 尺立方的物件, 持续数小时。
      en: |-
        You pull wisps of shadow material from the Shadowfell to create an object within range. It is either an object of vegetable matter (soft goods, rope, wood, and the like) or mineral matter (stone, crystal, metal, and the like). The object must be no larger than a 5-foot Cube, and the object must be of a form and material that you have seen. The spell's duration depends on the object's material, as shown in the Materials table. If the object is composed of multiple materials, use the shortest duration. Using any object created by this spell as another spell's Material component causes the other spell to fail. Materials Material Duration Stone or crystal 12 hours Gems 10 minutes Adamantine or mithral 1 minute

  - id: dnd2024.spell.dispel_evil_and_good
    name: {zh: 驱散善恶, en: Dispel Evil and Good}
    level: 5
    school: abjuration
    casting: action
    range: self
    components: [v, s, m]
    material: "powdered silver and iron"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: cha
    text:
      zh: |-
        异界生物被驱散, 你免疫其魅惑/恐慌(专注 1 分钟)。
      en: |-
        For the duration, Celestials, Elementals, Fey, Fiends, and Undead have Disadvantage on attack rolls against you. You can end the spell early by using either of the following special functions. Break Enchantment. As a Magic action, you touch a creature that is possessed by or has the Charmed or Frightened condition from one or more creatures of the types above. The target is no longer possessed, Charmed, or Frightened by such creatures. Dismissal. As a Magic action, you target one creature you can see within 5 feet of you that has one of the creature types above. The target must succeed on a Charisma saving throw or be sent back to its home plane if it isn't there already. If they aren't on their home plane, Undead are sent to the Shadowfell, and Fey are sent to the Feywild.

  - id: dnd2024.spell.dominate_person
    name: {zh: 支配人类, en: Dominate Person}
    level: 5
    school: enchantment
    casting: action
    range: {feet: 60}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: wis
    upcast: "Your Concentration can last longer with a spell slot of level 6 (up to 10 minutes), 7 (up to 1 hour), or 8+ (up to 8 hours)."
    text:
      zh: |-
        支配一个人形生物(专注 1 分钟)。
      en: |-
        One Humanoid you can see within range must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target has Advantage on the save if you or your allies are fighting it. Whenever the target takes damage, it repeats the save, ending the spell on itself on a success. You have a telepathic link with the Charmed target while the two of you are on the same plane of existence. On your turn, you can use this link to issue commands to the target (no action required), such as "Attack that creature," "Move over there," or "Fetch that object." The target does its best to obey on its turn. If it completes an order and doesn't receive further direction from you, it acts and moves as it likes, focusing on protecting itself. You can command the target to take a Reaction but must take your own Reaction to do so.

  - id: dnd2024.spell.dream
    name: {zh: 托梦术, en: Dream}
    level: 5
    school: illusion
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: special
    components: [v, s, m]
    material: "a handful of sand"
    duration: {kind: time, zh: 8 小时, en: 8 hours}
    save: wis
    damage: {type: psychic, 5: 3d6}
    text:
      zh: |-
        进入目标梦境传递讯息或制造噩梦(8 小时)。
      en: |-
        You target a creature you know on the same plane of existence. You or a willing creature you touch enters a trance state to act as a dream messenger. While in the trance, the messenger is Incapacitated and has a Speed of 0. If the target is asleep, the messenger appears in the target's dreams and can converse with the target as long as it remains asleep, through the spell's duration. The messenger can also shape the dream's environment, creating landscapes, objects, and other images. The messenger can emerge from the trance at any time, ending the spell. The target recalls the dream perfectly upon waking. If the target is awake when you cast the spell, the messenger knows it and can either end the trance (and the spell) or wait for the target to sleep, at which point the messenger enters its dreams. You can make the messenger terrifying to the target. If you do so, the messenger can deliver a message of no more than ten words, and then the target makes a Wisdom saving throw. On a failed save, the target gains no benefit from its rest, and it takes 3d6 Psychic damage when it wakes up.

  - id: dnd2024.spell.flame_strike
    name: {zh: 焰击术, en: Flame Strike}
    level: 5
    school: evocation
    casting: action
    range: {feet: 60}
    components: [v, s, m]
    material: "a pinch of sulfur"
    duration: instant
    save: dex
    damage: {type: fire, 5: 5d6}
    upcast: "The Fire damage and the Radiant damage increase by 1d6 for each spell slot level above 5."
    text:
      zh: |-
        10 尺半径火柱, 5d6 火焰 + 5d6 光耀(敏捷豁免减半)。
      en: |-
        A vertical column of brilliant fire roars down from above. Each creature in a 10-foot-radius, 40-foothigh Cylinder centered on a point within range makes a Dexterity saving throw, taking 5d6 Fire damage and 5d6 Radiant damage on a failed save or half as much damage on a successful one.

  - id: dnd2024.spell.geas
    name: {zh: 指使术, en: Geas}
    level: 5
    school: enchantment
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: {feet: 60}
    components: [v]
    duration: {kind: time, zh: 30 天, en: 30 days}
    save: wis
    damage: {type: psychic, 5: 5d10}
    upcast: "If you use a level 7 or 8 spell slot, the duration is 365 days. If you use a level 9 spell slot, the spell lasts until it is ended by one of the spells mentioned above."
    text:
      zh: |-
        命令目标执行/禁行某事, 违者受 5d10 心灵伤害(30 天)。
      en: |-
        You give a verbal command to a creature that you can see within range, ordering it to carry out some service or refrain from an action or a course of activity as you decide. The target must succeed on a Wisdom saving throw or have the Charmed condition for the duration. The target automatically succeeds if it can't understand your command. While Charmed, the creature takes 5d10 Psychic damage if it acts in a manner directly counter to your command. It takes this damage no more than once each day. You can issue any command you choose, short of an activity that would result in certain death. Should you issue a suicidal command, the spell ends. A Remove Curse, Greater Restoration, or Wish spell ends this spell.

  - id: dnd2024.spell.greater_restoration
    name: {zh: 高等复原术, en: Greater Restoration}
    level: 5
    school: abjuration
    casting: action
    range: touch
    components: [v, s, m]
    material: "diamond dust worth 100+ GP, which the spell consumes"
    duration: instant
    text:
      zh: |-
        解除石化/力竭/魅惑/诅咒或属性减损。
      en: |-
        You touch a creature and magically remove one of the following effects from it: • 1 Exhaustion level • The Charmed or Petrified condition • A curse, including the target's Attunement to a cursed magic item • Any reduction to one of the target's ability scores • Any reduction to the target's Hit Point maximum

  - id: dnd2024.spell.hallow
    name: {zh: 圣居术, en: Hallow}
    level: 5
    school: abjuration
    casting: {kind: time, zh: 24 小时, en: 24 hours}
    range: touch
    components: [v, s, m]
    material: "incense worth 1,000+ GP, which the spell consumes"
    duration: {kind: special, zh: 直到被驱散, en: Until dispelled}
    text:
      zh: |-
        圣化一片区域, 附加守护效果(持续至解除)。
      en: |-
        You touch a point and infuse an area around it with holy or unholy power. The area can have a radius up to 60 feet, and the spell fails if the radius includes an area already under the effect of Hallow. The affected area has the following effects. Hallowed Ward. Choose any of these creature types: Aberration, Celestial, Elemental, Fey, Fiend, or Undead. Creatures of the chosen types can't willingly enter the area, and any creature that is possessed by or that has the Charmed or Frightened condition from such creatures isn't possessed, Charmed, or Frightened by them while in the area. Extra Effect. You bind an extra effect to the area from the list below: Courage. Creatures of any types you choose can't gain the Frightened condition while in the area. Darkness. Darkness fills the area. Normal light, as well as magical light created by spells of a level lower than this spell, can't illuminate the area. Daylight. Bright light fills the area. Magical Darkness created by spells of a level lower than this spell can't extinguish the light. Peaceful Rest. Dead bodies interred in the area can't be turned into Undead. Extradimensional Interference. Creatures of any types you choose can't enter or exit the area using teleportation or interplanar travel. Fear. Creatures of any types you choose have the Frightened condition while in the area. Resistance. Creatures of any types you choose have Resistance to one damage type of your choice while in the area. Silence. No sound can emanate from within the area, and no sound can reach into it. Tongues. Creatures of any types you choose can communicate with any other creature in the area even if they don't share a common language. Vulnerability. Creatures of any types you choose have Vulnerability to one damage type of your choice while in the area.

  - id: dnd2024.spell.hold_monster
    name: {zh: 怪物定身术, en: Hold Monster}
    level: 5
    school: enchantment
    casting: action
    range: {feet: 90}
    components: [v, s, m]
    material: "a straight piece of iron"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: wis
    upcast: "You can target one additional creature for each spell slot level above 5."
    text:
      zh: |-
        任意类型生物感知豁免失败则麻痹(专注 1 分钟)。
      en: |-
        Choose a creature that you can see within range. The target must succeed on a Wisdom saving throw or have the Paralyzed condition for the duration. At the end of each of its turns, the target repeats the save, ending the spell on itself on a success.

  - id: dnd2024.spell.insect_plague
    name: {zh: 虫群瘟疫, en: Insect Plague}
    level: 5
    school: conjuration
    casting: action
    range: {feet: 300}
    components: [v, s, m]
    material: "a locust"
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    save: con
    area: {shape: sphere, feet: 20}
    damage: {type: piercing, 5: 4d10}
    upcast: "The damage increases by 1d10 for each spell slot level above 5."
    text:
      zh: |-
        20 尺半径虫群, 4d10 穿刺伤害(体质豁免减半)。
      en: |-
        Swarming locusts fill a 20-foot-radius Sphere centered on a point you choose within range. The Sphere remains for the duration, and its area is Lightly Obscured and Difficult Terrain. When the swarm appears, each creature in it makes a Constitution saving throw, taking 4d10 Piercing damage on a failed save or half as much damage on a successful one. A creature also makes this save when it enters the spell's area for the first time on a turn or ends its turn there. A creature makes this save only once per turn.

  - id: dnd2024.spell.legend_lore
    name: {zh: 通晓传奇, en: Legend Lore}
    level: 5
    school: divination
    casting: {kind: time, zh: 10 分钟, en: 10 minutes}
    range: self
    components: [v, s, m]
    material: "incense worth 250+ GP, which the spell consumes, and four ivory strips worth 50+ GP each"
    duration: instant
    text:
      zh: |-
        得知一件人/物/地点的传奇信息。
      en: |-
        Name or describe a famous person, place, or object. The spell brings to your mind a brief summary of the significant lore about that famous thing, as described by the GM. The lore might consist of important details, amusing revelations, or even secret lore that has never been widely known. The more information you already know about the thing, the more precise and detailed the information you receive is. That information is accurate but might be couched in figurative language or poetry, as determined by the GM. If the famous thing you chose isn't actually famous, you hear sad musical notes played on a trombone, and the spell fails.

  - id: dnd2024.spell.mass_cure_wounds
    name: {zh: 群体治疗之伤, en: Mass Cure Wounds}
    level: 5
    school: abjuration
    casting: action
    range: {feet: 60}
    components: [v, s]
    duration: instant
    area: {shape: sphere, feet: 30}
    upcast: "The healing increases by 1d8 for each spell slot level above 5."
    text:
      zh: |-
        30 尺内至多 6 人各回复 5d8+施法属性 HP。
      en: |-
        A wave of healing energy washes out from a point you can see within range. Choose up to six creatures in a 30-foot-radius Sphere centered on that point. Each target regains Hit Points equal to 5d8 plus your spellcasting ability modifier.

  - id: dnd2024.spell.mislead
    name: {zh: 误导术, en: Mislead}
    level: 5
    school: illusion
    casting: action
    range: self
    components: [s]
    duration: {kind: time, zh: 专注，最多 1 小时, en: up to 1 hour}
    concentration: true
    text:
      zh: |-
        你隐形并可操控一个幻影分身(专注 1 小时)。
      en: |-
        You gain the Invisible condition at the same time that an illusory double of you appears where you are standing. The double lasts for the duration, but the invisibility ends immediately after you make an attack roll, deal damage, or cast a spell. As a Magic action, you can move the illusory double up to twice your Speed and make it gesture, speak, and behave in whatever way you choose. It is intangible and invulnerable. You can see through its eyes and hear through its ears as if you were located where it is.

  - id: dnd2024.spell.modify_memory
    name: {zh: 修改记忆, en: Modify Memory}
    level: 5
    school: enchantment
    casting: action
    range: {feet: 30}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: wis
    upcast: "You can alter the target's memories of an event that took place up to 7 days ago (level 6 spell slot), 30 days ago (level 7 spell slot), 365 days ago (level 8 spell slot), or any time in the creature's past (level 9 spell slot)."
    text:
      zh: |-
        修改目标最近 24 小时的记忆(感知豁免否定)。
      en: |-
        You attempt to reshape another creature's memories. One creature that you can see within range makes a Wisdom saving throw. If you are fighting the creature, it has Advantage on the save. On a failed save, the target has the Charmed condition for the duration. While Charmed in this way, the target also has the Incapacitated condition and is unaware of its surroundings, though it can hear you. If it takes any damage or is targeted by another spell, this spell ends, and no memories are modified. While this charm lasts, you can affect the target's memory of an event that it experienced within the last 24 hours and that lasted no more than 10 minutes. You can permanently eliminate all memory of the event, allow the target to recall the event with perfect clarity, change its memory of the event's details, or create a memory of some other event. You must speak to the target to describe how its memories are affected, and it must be able to understand your language for the modified memories to take root. Its mind fills in any gaps in the details of your description. If the spell ends before you finish describing the modified memories, the creature's memory isn't altered. Otherwise, the modified memories take hold when the spell ends. A modified memory doesn't necessarily affect how a creature behaves, particularly if the memory contradicts the creature's natural inclinations, alignment, or beliefs. An illogical modified memory, such as a false memory of how much the creature enjoyed swimming in acid, is dismissed as a bad dream. The GM might deem a modified memory too nonsensical to affect a creature. A Remove Curse or Greater Restoration spell cast on the target restores the creature's true memory.

  - id: dnd2024.spell.passwall
    name: {zh: 穿墙术, en: Passwall}
    level: 5
    school: transmutation
    casting: action
    range: {feet: 30}
    components: [v, s, m]
    material: "a pinch of sesame seeds"
    duration: {kind: time, zh: 1 小时, en: 1 hour}
    text:
      zh: |-
        在墙面开出一条 5 尺宽通道, 持续 1 小时。
      en: |-
        A passage appears at a point that you can see on a wooden, plaster, or stone surface (such as a wall, ceiling, or floor) within range and lasts for the duration. You choose the opening's dimensions: up to 5 feet wide, 8 feet tall, and 20 feet deep. The passage creates no instability in a structure surrounding it. When the opening disappears, any creatures or objects still in the passage created by the spell are safely ejected to an unoccupied space nearest to the surface on which you cast the spell.

  - id: dnd2024.spell.planar_binding
    name: {zh: 异界誓缚, en: Planar Binding}
    level: 5
    school: abjuration
    casting: {kind: time, zh: 1 小时, en: 1 hour}
    range: {feet: 60}
    components: [v, s, m]
    material: "a jewel worth 1,000+ GP, which the spell consumes"
    duration: {kind: time, zh: 24 小时, en: 24 hours}
    save: cha
    upcast: "The duration increases with a spell slot of level 6 (10 days), 7 (30 days), 8 (180 days), and 9 (366 days)."
    text:
      zh: |-
        束缚一个异界生物为你服务 24 小时。
      en: |-
        You attempt to bind a Celestial, an Elemental, a Fey, or a Fiend to your service. The creature must be within range for the entire casting of the spell. (Typically, the creature is first summoned into the center of the inverted version of the Magic Circle spell to trap it while this spell is cast.) At the completion of the casting, the target must succeed on a Charisma saving throw or be bound to serve you for the duration. If the creature was summoned or created by another spell, that spell's duration is extended to match the duration of this spell. A bound creature must follow your commands to the best of its ability. You might command the creature to accompany you on an adventure, to guard a location, or to deliver a message. If the creature is Hostile, it strives to twist your commands to achieve its own objectives. If the creature carries out your commands completely before the spell ends, it travels to you to report this fact if you are on the same plane of existence. If you are on a different plane, it returns to the place where you bound it and remains there until the spell ends.

  - id: dnd2024.spell.raise_dead
    name: {zh: 死者复活, en: Raise Dead}
    level: 5
    school: necromancy
    casting: {kind: time, zh: 1 小时, en: 1 hour}
    range: touch
    components: [v, s, m]
    material: "a diamond worth 500+ GP, which, the spell consumes"
    duration: instant
    text:
      zh: |-
        复活 10 天内死亡的生物, 回复 1 HP。
      en: |-
        With a touch, you revive a dead creature if it has been dead no longer than 10 days and it wasn't Undead when it died. The creature returns to life with 1 Hit Point. This spell also neutralizes any poisons that affected the creature at the time of death. This spell closes all mortal wounds, but it doesn't restore missing body parts. If the creature is lacking body parts or organs integral for its survivalits head, for instance-the spell automatically fails. Coming back from the dead is an ordeal. The target takes a -4 penalty to D20 Tests. Every time the target finishes a Long Rest, the penalty is reduced by 1 until it becomes 0.

  - id: dnd2024.spell.reincarnate
    name: {zh: 转生术, en: Reincarnate}
    level: 5
    school: necromancy
    casting: {kind: time, zh: 1 小时, en: 1 hour}
    range: touch
    components: [v, s, m]
    material: "rare oils worth 1,000+ GP, which the spell consumes"
    duration: instant
    text:
      zh: |-
        复活死者但换一副新身体。
      en: |-
        You touch a dead Humanoid or a piece of one. If the creature has been dead no longer than 10 days, the spell forms a new body for it and calls the soul to enter that body. Roll 1d10 and consult the table below to determine the body's species, or the GM chooses another playable species. 1d10 Species 1d10 Species 1 Roll again. 6 Goliath 2 Dragonborn 7 Halfling 3 Dwarf 8 Human 4 Elf 9 Orc 5 Gnome 10 Tiefling The reincarnated creature makes any choices that a species' description offers, and the creature recalls its former life. It retains the capabilities it had in its original form, except it loses the traits of its previous species and gains the traits of its new one.

  - id: dnd2024.spell.scrying
    name: {zh: 探知术, en: Scrying}
    level: 5
    school: divination
    casting: {kind: time, zh: 10 分钟, en: 10 minutes}
    range: self
    components: [v, s, m]
    material: "a focus worth 1,000+ GP, such as, a crystal ball, mirror, or water-filled font"
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    save: wis
    text:
      zh: |-
        窥视 10 里内一个目标(感知豁免否定, 专注 10 分钟)。
      en: |-
        You can see and hear a creature you choose that is on the same plane of existence as you. The target makes a Wisdom saving throw, which is modified (see the tables below) by how well you know the target and the sort of physical connection you have to it. The target doesn't know what it is making the save against, only that it feels uneasy. Your Knowledge of the Target Is ... Save Modifier Firsthand (met the target) +0 You Have the Target's ... Save Modifier Garment or other possession -4 On a successful save, the target isn't affected, and you can't use this spell on it again for 24 hours. On a failed save, the spell creates an Invisible, intangible sensor within 10 feet of the target. You can see and hear through the sensor as if you were there. The sensor moves with the target, remaining within 10 feet of it for the duration. If something can see the sensor, it appears as a luminous orb about the size of your fist. Instead of targeting a creature, you can target a location you have seen. When you do so, the sensor appears at that location and doesn't move.

  - id: dnd2024.spell.seeming
    name: {zh: 幻容术, en: Seeming}
    level: 5
    school: illusion
    casting: action
    range: {feet: 30}
    components: [v, s]
    duration: {kind: time, zh: 8 小时, en: 8 hours}
    save: cha
    text:
      zh: |-
        改变至多 12 个生物的外貌, 持续 8 小时。
      en: |-
        You give an illusory appearance to each creature of your choice that you can see within range. An unwilling target can make a Charisma saving throw, and if it succeeds, it is unaffected by this spell. You can give the same appearance or different ones to the targets. The spell can change the appearance of the targets' bodies and equipment. You can make each creature seem 1 foot shorter or taller and appear heavier or lighter. A target's new appearance must have the same basic arrangement of limbs as the target, but the extent of the illusion is otherwise up to you. The spell lasts for the duration. The changes wrought by this spell fail to hold up to physical inspection. For example, if you use this spell to add a hat to a creature's outfit, objects pass through the hat. A creature that takes the Study action to examine a target can make an Intelligence (Investigation) check against your spell save DC. If it succeeds, it becomes aware that the target is disguised.

  - id: dnd2024.spell.summon_dragon
    name: {zh: 召唤巨龙, en: Summon Dragon}
    level: 5
    school: conjuration
    casting: action
    range: {feet: 60}
    components: [v, s, m]
    material: "an object with the image of a, dragon engraved on it worth 500+ GP"
    duration: {kind: time, zh: 专注，最多 1 小时, en: up to 1 hour}
    concentration: true
    upcast: "Use the spell slot's level for the spell's level in the stat block. Large Dragon, Neutral AC 14 + the spell's level HP 50 + 10 for each spell level above 5 Speed 30 ft., Fly 60 ft., Swim 30 ft. MOD SAVE MOD SAVE MOD SAVE Str 19 +4 +4 dex 14 +2 +2 con 17 +3 +3 int 10 +0 +0 WiS 14 +2 +2 chA 14 +2 +2 Resistances Acid, Cold, Fire, Lightning, Poison Immunities Charmed, Frightened, Poisoned Senses Blindsight 30 ft., Darkvision 60 ft.; Passive Perception 12 Languages Draconic, understands the languages you know CR None (XP 0; PB equals your Proficiency Bonus) Traits Shared Resistances. When you summon the spirit, choose one of its Resistances. You have Resistance to the chosen damage type until the spell ends. Actions Multiattack. The spirit makes a number of Rend attacks equal to half the spell's level (round down), and it uses Breath Weapon. Rend. Melee Attack Roll: Bonus equals your spell attack modifier, reach 10 feet. Hit: 1d6 + 4 + the spell's level Piercing damage. Breath Weapon. Dexterity Saving Throw: DC equals your spell save DC, each creature in a 30-foot Cone. Failure: 2d6 damage of a type this spirit has Resistance to (your choice when you cast the spell). Success: Half damage."
    text:
      zh: |-
        召唤精魂巨龙, 可吐息(专注 1 小时)。
      en: |-
        You call forth a Dragon spirit. It manifests in an unoccupied space that you can see within range and uses the Draconic Spirit stat block. The creature disappears when it drops to 0 Hit Points or when the spell ends. The creature is an ally to you and your allies. In combat, the creature shares your Initiative count, but it takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don't issue any, it takes the Dodge action and uses its movement to avoid danger.

  - id: dnd2024.spell.telekinesis
    name: {zh: 念力, en: Telekinesis}
    level: 5
    school: transmutation
    casting: action
    range: {feet: 60}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    save: str
    text:
      zh: |-
        念力移动 1000 磅物体或一个生物(专注 10 分钟)。
      en: |-
        You gain the ability to move or manipulate creatures or objects by thought. When you cast the spell and as a Magic action on your later turns before the spell ends, you can exert your will on one creature or object that you can see within range, causing the appropriate effect below. You can affect the same target round after round or choose a new one at any time. If you switch targets, the prior target is no longer affected by the spell. Creature. You can try to move a Huge or smaller creature. The target must succeed on a Strength saving throw, or you move it up to 30 feet in any direction within the spell's range. Until the end of your next turn, the creature has the Restrained condition, and if you lift it into the air, it is suspended there. It falls at the end of your next turn unless you use this option on it again and it fails the save. Object. You can try to move a Huge or smaller object. If the object isn't being worn or carried, you automatically move it up to 30 feet in any direction within the spell's range. If the object is worn or carried by a creature, that creature must succeed on a Strength saving throw, or you pull the object away and move it up to 30 feet in any direction within the spell's range. You can exert fine control on objects with your telekinetic grip, such as manipulating a simple tool,

  - id: dnd2024.spell.telepathic_bond
    name: {zh: 心灵联结, en: Telepathic Bond}
    level: 5
    school: divination
    casting: action
    range: {feet: 30}
    components: [v, s, m]
    material: "two eggs"
    duration: {kind: time, zh: 1 小时, en: 1 hour}
    ritual: true
    text:
      zh: |-
        8 小时内与至多 8 个生物心灵沟通(任意距离同一位面)。
      en: |-
        You forge a telepathic link among up to eight willing creatures of your choice within range, psychically linking each creature to all the others for the duration. Creatures that can't communicate in any languages aren't affected by this spell. Until the spell ends, the targets can communicate telepathically through the bond whether or not they share a language. The communication is possible over any distance, though it can't extend to other planes of existence.

  - id: dnd2024.spell.teleportation_circle
    name: {zh: 传送法阵, en: Teleportation Circle}
    level: 5
    school: conjuration
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: {feet: 10}
    components: [v, m]
    material: "rare inks worth 50+ GP, which the, spell consumes"
    duration: {kind: time, zh: 1 轮, en: 1 round}
    text:
      zh: |-
        造出永久传送法阵, 通往你指定的另一法阵。
      en: |-
        As you cast the spell, you draw a 5-foot-radius circle on the ground inscribed with sigils that link your location to a permanent teleportation circle of your choice whose sigil sequence you know and that is on the same plane of existence as you. A shimmering portal opens within the circle you drew and remains open until the end of your next turn. Any creature that enters the portal instantly appears within 5 feet of the destination circle or in the nearest unoccupied space if that space is occupied. Many major temples, guildhalls, and other important places have permanent teleportation circles. Each circle includes a unique sigil sequence-a string of runes arranged in a particular pattern. When you first gain the ability to cast this spell, you learn the sigil sequences for two destinations on the Material Plane, determined by the GM. You might learn additional sigil sequences during your adventures. You can commit a new sigil sequence to memory after studying it for 1 minute. You can create a permanent teleportation circle by casting this spell in the same location every day for 365 days.

  - id: dnd2024.spell.tree_stride
    name: {zh: 树跃术, en: Tree Stride}
    level: 5
    school: conjuration
    casting: action
    range: self
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    text:
      zh: |-
        在树木之间瞬间移动(专注 1 分钟)。
      en: |-
        You gain the ability to enter a tree and move from inside it to inside another tree of the same kind within 500 feet. Both trees must be living and at least the same size as you. You must use 5 feet of movement to enter a tree. You instantly know the location of all other trees of the same kind within 500 feet and, as part of the move used to enter the tree, can either pass into one of those trees or step out of the tree you're in. You appear in a spot of your choice within 5 feet of the destination tree, using another 5 feet of movement. If you have no movement left, you appear within 5 feet of the tree you entered. You can use this transportation ability only once on each of your turns. You must end each turn outside a tree.

  - id: dnd2024.spell.wall_of_force
    name: {zh: 力场墙, en: Wall of Force}
    level: 5
    school: evocation
    casting: action
    range: {feet: 120}
    components: [v, s, m]
    material: "a shard of glass"
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    text:
      zh: |-
        造出力场墙, 无法被普通手段破坏(专注 10 分钟)。
      en: |-
        An Invisible wall of force springs into existence at a point you choose within range. The wall appears in any orientation you choose, as a horizontal or vertical barrier or at an angle. It can be free floating or resting on a solid surface. You can form it into a hemispherical dome or a globe with a radius of up to 10 feet, or you can shape a flat surface made up of ten 10-foot-by-10-foot panels. Each panel must be contiguous with another panel. In any form, the wall is 1/4 inch thick and lasts for the duration. If the wall cuts through a creature's space when it appears, the creature is pushed to one side of the wall (you choose which side). Nothing can physically pass through the wall. It is immune to all damage and can't be dispelled by Dispel Magic. A Disintegrate spell destroys the wall instantly, however. The wall also extends into the Ethereal Plane and blocks ethereal travel through the wall.

  - id: dnd2024.spell.wall_of_stone
    name: {zh: 石墙术, en: Wall of Stone}
    level: 5
    school: evocation
    casting: action
    range: {feet: 120}
    components: [v, s, m]
    material: "a cube of granite"
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    save: dex
    text:
      zh: |-
        造出石墙, 可塑形(专注 10 分钟)。
      en: |-
        A nonmagical wall of solid stone springs into existence at a point you choose within range. The wall is 6 inches thick and is composed of ten 10-foot-by10-foot panels. Each panel must be contiguous with another panel. Alternatively, you can create 10-footby-20-foot panels that are only 3 inches thick. If the wall cuts through a creature's space when it appears, the creature is pushed to one side of the wall (you choose which side). If a creature would be surrounded on all sides by the wall (or the wall and another solid surface), that creature can make a Dexterity saving throw. On a success, it can use its Reaction to move up to its Speed so that it is no longer enclosed by the wall. The wall can have any shape you desire, though it can't occupy the same space as a creature or object. The wall doesn't need to be vertical or rest on a firm foundation. It must, however, merge with and be solidly supported by existing stone. Thus, you can use this spell to bridge a chasm or create a ramp. If you create a span greater than 20 feet in length, you must halve the size of each panel to create supports. You can crudely shape the wall to create battlements and the like. The wall is an object made of stone that can be damaged and thus breached. Each panel has AC 15 and 30 Hit Points per inch of thickness, and it has Immunity to Poison and Psychic damage. Reducing a panel to 0 Hit Points destroys it and might cause connected panels to collapse at the GM's discretion. If you maintain your Concentration on this spell for its full duration, the wall becomes permanent and can't be dispelled. Otherwise, the wall disappears when the spell ends.
