# 由 tools/gen_spells.py 从 data/raw/spells.json + dnd55e_spells.json 生成。
# 第 7 环，共 20 条。重跑生成器会覆盖；要长期改动请改数据源。
# 没有结构化伤害的法术（控制类）只登记规则原文，damage 留空 —— 不猜。
  - id: dnd2024.spell.arcane_sword
    name: {zh: 奥术剑, en: Arcane Sword}
    level: 7
    school: evocation
    casting: action
    range: {feet: 90}
    components: [v, s, m]
    material: "(a miniature sword worth 250+ GP"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    attack: melee
    text:
      zh: |-
        造出浮动力场剑, 每回合攻击 3d10 力场伤害(专注 1 分钟)。
      en: |-
        You create a spectral sword that hovers within range. It lasts for the duration. When the sword appears, you make a melee spell attack against a target within 5 feet of the sword. On a hit, the target takes Force damage equal to 4d12 plus your spellcasting ability modifier. On your later turns, you can take a Bonus Action to move the sword up to 30 feet to a spot you can see and repeat the attack against the same target or a different one.

  - id: dnd2024.spell.conjure_celestial
    name: {zh: 召唤天界生物, en: Conjure Celestial}
    level: 7
    school: conjuration
    casting: action
    range: {feet: 90}
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 10 分钟, en: up to 10 minutes}
    concentration: true
    save: dex
    save_effect: half
    damage: {type: radiant, 7: 6d12}
    upcast: "The healing and damage increase by 1d12 for each spell slot level above 7."
    upcast_dice: {dice: 1d12, above: 7}
    text:
      zh: |-
        召唤天界生物为你作战(专注 1 小时)。
      en: |-
        You conjure a spirit from the Upper Planes, which manifests as a pillar of light in a 10-foot-radius, 40-foot-high Cylinder centered on a point within range. For each creature you can see in the Cylinder, choose which of these lights shines on it: Healing Light. The target regains Hit Points equal to 4d12 plus your spellcasting ability modifier. Searing Light. The target makes a Dexterity saving throw, taking 6d12 Radiant damage on a failed save or half as much damage on a successful one. Until the spell ends, Bright Light fills the Cylinder, and when you move on your turn, you can also move the Cylinder up to 30 feet. Whenever the Cylinder moves into the space of a creature you can see and whenever a creature you can see enters the Cylinder or ends its turn there, you can bathe it in one of the lights. A creature can be affected by this spell only once per turn.

  - id: dnd2024.spell.delayed_blast_fireball
    name: {zh: 延迟爆裂火球, en: Delayed Blast Fireball}
    level: 7
    school: evocation
    casting: action
    range: {feet: 150}
    components: [v, s, m]
    material: "a ball of bat guano and sulfur"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: dex
    area: {shape: sphere, feet: 20}
    upcast: "The base damage increases by 1d6 for each spell slot level above 7."
    text:
      zh: |-
        延迟爆炸的火球, 每回合增伤 1d6(专注 1 分钟)。
      en: |-
        A beam of yellow light flashes from you, then condenses at a chosen point within range as a glowing bead for the duration. When the spell ends, the bead explodes, and each creature in a 20-foot-radius Sphere centered on that point makes a Dexterity saving throw. A creature takes Fire damage equal to the total accumulated damage on a failed save or half as much damage on a successful one. The spell's base damage is 12d6, and the damage increases by 1d6 whenever your turn ends and the spell hasn't ended. If a creature touches the glowing bead before the spell ends, that creature makes a Dexterity saving throw. On a failed save, the spell ends, causing the bead to explode. On a successful save, the creature can throw the bead up to 40 feet. If the thrown bead enters a creature's space or collides with a solid object, the spell ends, and the bead explodes. When the bead explodes, flammable objects in the explosion that aren't being worn or carried start burning.

  - id: dnd2024.spell.divine_word
    name: {zh: 神圣真言, en: Divine Word}
    level: 7
    school: evocation
    casting: bonus
    range: {feet: 30}
    components: [v]
    duration: instant
    save: cha
    text:
      zh: |-
        神圣一词使敌人目盲/失聪/震慑或死亡(按 HP)。
      en: |-
        You utter a word imbued with power from the Upper Planes. Each creature of your choice in range makes a Charisma saving throw. On a failed save, a target that has 50 Hit Points or fewer suffers an effect based on its current Hit Points, as shown in the Divine Word Effects table. Regardless of its Hit Points, a Celestial, an Elemental, a Fey, or a Fiend target that fails its save is forced back to its plane of origin (if it isn't there already) and can't return to the current plane for 24 hours by any means short of a Wish spell. Divine Word Effects | Hit Points Effect 0-20 | The target dies. 21-30 | The target has the Blinded, Deafened, and Stunned conditions for 1 hour. 41-50 | The target has the Deafened condition for 1 minute.

  - id: dnd2024.spell.etherealness
    name: {zh: 以太化, en: Etherealness}
    level: 7
    school: conjuration
    casting: action
    range: self
    components: [v, s]
    duration: {kind: time, zh: 专注，最多 8 小时, en: Up to 8 hours}
    upcast: "You can target up to three willing creatures (including yourself) for each spell slot level above 7. The creatures must be within 10 feet of you when you cast the spell."
    text:
      zh: |-
        进入以太位面, 可穿越物体(8 小时)。
      en: |-
        You step into the border regions of the Ethereal Plane, where it overlaps with your current plane. You remain in the Border Ethereal for the duration. During this time, you can move in any direction. If you move up or down, every foot of movement costs an extra foot. You can perceive the plane you left, which looks gray, and you can't see anything there more than 60 feet away. While on the Ethereal Plane, you can affect and be affected only by creatures, objects, and effects on that plane. Creatures that aren't on the Ethereal Plane can't perceive or interact with you unless a feature gives them the ability to do so. When the spell ends, you return to the plane you left in the spot that corresponds to your space in the Border Ethereal. If you appear in an occupied space, you are shunted to the nearest unoccupied space and take Force damage equal to twice the number of feet you are moved. This spell ends instantly if you cast it while you are on the Ethereal Plane or a plane that doesn't border it, such as one of the Outer Planes.

  - id: dnd2024.spell.finger_of_death
    name: {zh: 死亡一指, en: Finger of Death}
    level: 7
    school: necromancy
    casting: action
    range: {feet: 60}
    components: [v, s]
    duration: instant
    save: con
    text:
      zh: |-
        体质豁免失败受 7d8+30 黯蚀伤害, 死者化为僵尸。
      en: |-
        You unleash negative energy toward a creature you can see within range. The target makes a Constitution saving throw, taking 7d8 + 30 Necrotic damage on a failed save or half as much damage on a successful one. A Humanoid killed by this spell rises at the start of your next turn as a Zombie (see "Monsters") that follows your verbal orders.

  - id: dnd2024.spell.fire_storm
    name: {zh: 火焰风暴, en: Fire Storm}
    level: 7
    school: evocation
    casting: action
    range: {feet: 150}
    components: [v, s]
    duration: instant
    save: dex
    save_effect: half
    area: {shape: cube, feet: 10}
    damage: {type: fire, 7: 7d10}
    text:
      zh: |-
        10 个 10 尺立方火焰, 各 7d10 火焰(敏捷豁免减半)。
      en: |-
        A storm of fire appears within range. The area of the storm consists of up to ten 10-foot Cubes, which you arrange as you like. Each Cube must be contiguous with at least one other Cube. Each creature in the area makes a Dexterity saving throw, taking 7d10 Fire damage on a failed save or half as much damage on a successful one. Flammable objects in the area that aren't being worn or carried start burning.

  - id: dnd2024.spell.forcecage
    name: {zh: 力场牢笼, en: Forcecage}
    level: 7
    school: evocation
    casting: action
    range: {feet: 100}
    components: [v, s, m]
    material: "ruby dust worth 1,500+ GP,, which the spell consumes"
    duration: {kind: time, zh: 专注，最多 1 小时, en: up to 1 hour}
    concentration: true
    save: cha
    text:
      zh: |-
        造出力场牢笼, 无法逃脱(1 小时)。
      en: |-
        An immobile, Invisible, Cube-shaped prison composed of magical force springs into existence around an area you choose within range. The prison can be a cage or a solid box, as you choose. A prison in the shape of a cage can be up to 20 feet on a side and is made from 1/2-inch diameter bars spaced 1/2 inch apart. A prison in the shape of a box can be up to 10 feet on a side, creating a solid barrier that prevents any matter from passing through it and blocking any spells cast into or out from the area. When you cast the spell, any creature that is completely inside the cage's area is trapped. Creatures only partially within the area, or those too large to fit inside it, are pushed away from the center of the area until they are completely outside it. A creature inside the cage can't leave it by nonmagical means. If the creature tries to use teleportation or interplanar travel to leave, it must first make a Charisma saving throw. On a successful save, the creature can use that magic to exit the cage. On a failed save, the creature doesn't exit the cage and wastes the spell or effect. The cage also extends into the Ethereal Plane, blocking ethereal travel. This spell can't be dispelled by Dispel Magic.

  - id: dnd2024.spell.magnificent_mansion
    name: {zh: 华丽府邸, en: Magnificent Mansion}
    level: 7
    school: conjuration
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: {feet: 300}
    components: [v, s, m]
    material: "a miniature door worth 15+ GP"
    duration: {kind: time, zh: 24 小时, en: 24 hours}
    area: {shape: cube, feet: 10}
    text:
      zh: |-
        造出豪华异次元府邸, 持续 24 小时。
      en: |-
        You conjure a shimmering door in range that lasts for the duration. The door leads to an extradimensional dwelling and is 5 feet wide and 10 feet tall. You and any creature you designate when you cast the spell can enter the extradimensional dwelling as long as the door remains open. You can open or close it (no action required) if you are within 30 feet of it. While closed, the door is imperceptible. Beyond the door is a magnificent foyer with numerous chambers beyond. The dwelling's atmosphere is clean, fresh, and warm. You can create any floor plan you like for the dwelling, but it can't exceed 50 contiguous 10-foot Cubes. The place is furnished and decorated as you choose. It contains sufficient food to serve a ninecourse banquet for up to 100 people. Furnishings and other objects created by this spell dissipate into smoke if removed from it. A staff of 100 near-transparent servants attends all who enter. You determine the appearance of these servants and their attire. They are invulnerable and obey your commands. Each servant can perform tasks that a human could perform, but they can't attack or take any action that would directly harm another creature. Thus the servants can fetch things, clean, mend, fold clothes, light fires, serve food, pour wine, and so on. The servants can't leave the dwelling. When the spell ends, any creatures or objects left inside the extradimensional space are expelled into the unoccupied spaces nearest to the entrance.

  - id: dnd2024.spell.mirage_arcane
    name: {zh: 奥术幻景, en: Mirage Arcane}
    level: 7
    school: illusion
    casting: {kind: time, zh: 10 分钟, en: 10 minutes}
    range: sight
    components: [v, s]
    duration: {kind: time, zh: 10 天, en: 10 days}
    text:
      zh: |-
        把 1 平方里地形变为幻景, 持续 10 天。
      en: |-
        You make terrain in an area up to 1 mile square look, sound, smell, and even feel like some other sort of terrain. Open fields or a road could be made to resemble a swamp, hill, crevasse, or some other rough or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road. Similarly, you can alter the appearance of structures or add them where none are present. The spell doesn't disguise, conceal, or add creatures. The illusion includes audible, visual, tactile, and olfactory elements, so it can turn clear ground into Difficult Terrain (or vice versa) or otherwise impede movement through the area. Any piece of the illusory terrain (such as a rock or stick) that is removed from the spell's area disappears immediately. Creatures with Truesight can see through the illusion to the terrain's true form; however, all other elements of the illusion remain, so while the creature is aware of the illusion's presence, the creature can still physically interact with the illusion.

  - id: dnd2024.spell.plane_shift
    name: {zh: 位面转移, en: Plane Shift}
    level: 7
    school: conjuration
    casting: action
    range: touch
    components: [v, s, m]
    material: "a forked, metal rod worth 250+, GP and attuned to a plane of existence"
    duration: instant
    text:
      zh: |-
        把至多 8 个生物传送到另一存在位面。
      en: |-
        You and up to eight willing creatures who link hands in a circle are transported to a different plane of existence. You can specify a target destination in general terms, such as a specific city on the Elemental Plane of Fire or palace on the second level of the Nine Hells, and you appear in or near that destination, as determined by the GM. Alternatively, if you know the sigil sequence of a teleportation circle on another plane of existence, this spell can take you to that circle. If the teleportation circle is too small to hold all the creatures you transported, they appear in the closest unoccupied spaces next to the circle.

  - id: dnd2024.spell.prismatic_spray
    name: {zh: 虹光喷射, en: Prismatic Spray}
    level: 7
    school: evocation
    casting: action
    range: self
    components: [v, s]
    duration: instant
    save: dex
    save_effect: half
    area: {shape: cone, feet: 60}
    damage: {type: acid, 7: 12d6}
    text:
      zh: |-
        60 尺锥形七彩光, 随机颜色造成不同效果。
      en: |-
        Eight rays of light flash from you in a 60-foot Cone. Each creature in the Cone makes a Dexterity saving throw. For each target, roll 1d8 to determine which color ray affects it, consulting the Prismatic Rays table. Prismatic Rays 1d8 Ray 2 Orange. Failed Save: 12d6 Acid damage. Successful Save: Half as much damage. 4 Green. Failed Save: 12d6 Poison damage. Successful Save: Half as much damage. 1d8 Ray 6 Indigo. Failed Save: The target has the Restrained condition and makes a Constitution saving throw at the end of each of its turns. If it successfully saves three times, the condition ends. If it fails three times, it has the Petrified condition until it is freed by an effect like the Greater Restoration spell. The successes and failures needn't be consecutive; keep track of both until the target collects three of a kind. 8 Special. The target is struck by two rays. Roll twice, rerolling any 8.

  - id: dnd2024.spell.project_image
    name: {zh: 投影术, en: Project Image}
    level: 7
    school: illusion
    casting: action
    range: {feet: 2640000}
    components: [v, s, m]
    material: "a statuette of yourself worth, 5+ GP"
    duration: {kind: time, zh: 专注，最多 1 天, en: up to 1 day}
    concentration: true
    text:
      zh: |-
        造出你的幻影分身, 可从其位置施法(专注 1 天)。
      en: |-
        You create an illusory copy of yourself that lasts for the duration. The copy can appear at any location within range that you have seen before, regardless of intervening obstacles. The illusion looks and sounds like you, but it is intangible. If the illusion takes any damage, it disappears, and the spell ends. You can see through the illusion's eyes and hear through its ears as if you were in its space. As a Magic action, you can move it up to 60 feet and make it gesture, speak, and behave in whatever way you choose. It mimics your mannerisms perfectly. Physical interaction with the image reveals it to be illusory, since things can pass through it. A creature that takes the Study action to examine the image can determine that it is an illusion with a successful Intelligence (Investigation) check against your spell save DC. If a creature discerns the illusion for what it is, the creature can see through the image, and any noise it makes sounds hollow to the creature.

  - id: dnd2024.spell.regenerate
    name: {zh: 再生术, en: Regenerate}
    level: 7
    school: transmutation
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: touch
    components: [v, s, m]
    material: "a prayer wheel"
    duration: {kind: time, zh: 1 小时, en: 1 hour}
    text:
      zh: |-
        目标回复 4d8+15 HP 并再生断肢(1 小时)。
      en: |-
        A creature you touch regains 4d8 + 15 Hit Points. For the duration, the target regains 1 Hit Point at the start of each of its turns, and any severed body parts regrow after 2 minutes.

  - id: dnd2024.spell.resurrection
    name: {zh: 复生术, en: Resurrection}
    level: 7
    school: necromancy
    casting: {kind: time, zh: 1 小时, en: 1 hour}
    range: touch
    components: [v, s, m]
    material: "a diamond worth 1,000+ GP, which the spell consumes"
    duration: instant
    text:
      zh: |-
        复活 100 年内死者, 回复全部 HP。
      en: |-
        With a touch, you revive a dead creature that has been dead for no more than a century, didn't die of old age, and wasn't Undead when it died. The creature returns to life with all its Hit Points. This spell also neutralizes any poisons that affected the creature at the time of death. This spell closes all mortal wounds and restores any missing body parts. Coming back from the dead is an ordeal. The target takes a -4 penalty to D20 Tests. Every time the target finishes a Long Rest, the penalty is reduced by 1 until it becomes 0. Casting this spell to revive a creature that has been dead for 365 days or longer taxes you. Until you finish a Long Rest, you can't cast spells again, and you have Disadvantage on D20 Tests.

  - id: dnd2024.spell.reverse_gravity
    name: {zh: 逆转重力, en: Reverse Gravity}
    level: 7
    school: transmutation
    casting: action
    range: {feet: 100}
    components: [v, s, m]
    material: "a lodestone and iron filings"
    duration: {kind: time, zh: 专注，最多 1 分钟, en: up to 1 minute}
    concentration: true
    save: dex
    text:
      zh: |-
        50 尺半径重力逆转, 生物与物件上浮(专注 1 分钟)。
      en: |-
        This spell reverses gravity in a 50-foot-radius, 100foot high Cylinder centered on a point within range. All creatures and objects in that area that aren't anchored to the ground fall upward and reach the top of the Cylinder. A creature can make a Dexterity saving throw to grab a fixed object it can reach, thus avoiding the fall upward. If a ceiling or an anchored object is encountered in this upward fall, creatures and objects strike it just as they would during a downward fall. If an affected creature or object reaches the Cylinder's top without striking anything, it hovers there for the duration. When the spell ends, affected objects and creatures fall downward.

  - id: dnd2024.spell.sequester
    name: {zh: 隐匿术, en: Sequester}
    level: 7
    school: transmutation
    casting: action
    range: touch
    components: [v, s, m]
    material: "gem dust worth 5,000+ GP,, which the spell consumes"
    duration: {kind: special, zh: 直到被驱散, en: Until dispelled}
    text:
      zh: |-
        使目标隐形并沉睡, 无法被探知。
      en: |-
        With a touch, you magically sequester an object or a willing creature. For the duration, the target has the Invisible condition and can't be targeted by Divination spells, detected by magic, or viewed remotely with magic. If the target is a creature, it enters a state of suspended animation; it has the Unconscious condition, doesn't age, and doesn't need food, water, or air. You can set a condition for the spell to end early. The condition can be anything you choose, but it must occur or be visible within 1 mile of the target. Examples include "after 1,000 years" or "when the tarrasque awakens." This spell also ends if the target takes any damage.

  - id: dnd2024.spell.simulacrum
    name: {zh: 拟像术, en: Simulacrum}
    level: 7
    school: illusion
    casting: {kind: time, zh: 12 小时, en: 12 hours}
    range: touch
    components: [v, s, m]
    material: "powdered ruby worth 1,500+ GP,, which the spell consumes"
    duration: {kind: special, zh: 直到被驱散, en: Until dispelled}
    text:
      zh: |-
        造出目标生物的複制品为你服务。
      en: |-
        You create a simulacrum of one Beast or Humanoid that is within 10 feet of you for the entire casting of the spell. You finish the casting by touching both the creature and a pile of ice or snow that is the same size as that creature, and the pile turns into the simulacrum, which is a creature. It uses the game statistics of the original creature at the time of casting, except it is a Construct, its Hit Point maximum is half as much, and it can't cast this spell. The simulacrum is Friendly to you and creatures you designate. It obeys your commands and acts on your turn in combat. The simulacrum can't gain levels, and it can't take Short or Long Rests. If the simulacrum takes damage, the only way to restore its Hit Points is to repair it as you take a Long Rest, during which you expend components worth 100 GP per Hit Point restored. The simulacrum must stay within 5 feet of you for the repair. The simulacrum lasts until it drops to 0 Hit Points, at which point it reverts to snow and melts away. If you cast this spell again, any simulacrum you created with this spell is instantly destroyed.

  - id: dnd2024.spell.symbol
    name: {zh: 法术徽记, en: Symbol}
    level: 7
    school: abjuration
    casting: {kind: time, zh: 1 分钟, en: 1 minute}
    range: touch
    components: [v, s, m]
    material: "powdered diamond worth 1,000+ GP, which the spell consumes"
    duration: {kind: special, zh: 直到被驱散, en: Until dispelled or triggered}
    save: con
    save_effect: half
    area: {shape: sphere, feet: 60}
    damage: {type: necrotic, 7: 10d10}
    text:
      zh: |-
        刻下致命徽记, 触发时造成范围伤害或控制。
      en: |-
        You inscribe a harmful glyph either on a surface (such as a section of floor or wall) or within an object that can be closed (such as a book or chest). The glyph can cover an area no larger than 10 feet in diameter. If you choose an object, it must remain in place; if it is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered. The glyph is nearly imperceptible and requires a successful Wisdom (Perception) check against your spell save DC to notice. When you inscribe the glyph, you set its trigger and choose which effect the symbol bears: Death, Discord, Fear, Pain, Sleep, or Stunning. Each one is explained below. Set the Trigger. You decide what triggers the glyph when you cast the spell. For glyphs inscribed on a surface, common triggers include touching or stepping on the glyph, removing another object covering it, or approaching within a certain distance of it. For glyphs inscribed within an object, common triggers include opening that object or seeing the glyph. You can refine the trigger so that only creatures of certain types activate it (for example, the glyph could be set to affect Aberrations). You can also set conditions for creatures that don't trigger the glyph, such as those who say a certain password. Once triggered, the glyph glows, filling a 60-foot-radius Sphere with Dim Light for 10 minutes, after which time the spell ends. Each creature in the Sphere when the glyph activates is targeted by its effect, as is a creature that enters the Sphere for the first time on a turn or ends its turn there. A creature is targeted only once per turn. Death. Each target makes a Constitution saving throw, taking 10d10 Necrotic damage on a failed save or half as much damage on a successful save. Discord. Each target makes a Wisdom saving throw. On a failed save, a target argues with other creatures for 1 minute. During this time, it is incapable of meaningful communication and has Disadvantage on attack rolls and ability checks. Fear. Each target must succeed on a Wisdom saving throw or have the Frightened condition for 1 minute. While Frightened, the target must move at least 30 feet away from the glyph on each of its turns, if able. Pain. Each target must succeed on a Constitution saving throw or have the Incapacitated condition for 1 minute. Sleep. Each target must succeed on a Wisdom saving throw or have the Unconscious condition for 10 minutes. A creature awakens if it takes damage or if someone takes an action to shake it awake. Stunning. Each target must succeed on a Wisdom saving throw or have the Stunned condition for 1 minute.

  - id: dnd2024.spell.teleport
    name: {zh: 传送术, en: Teleport}
    level: 7
    school: conjuration
    casting: action
    range: {feet: 10}
    components: [v]
    duration: instant
    damage: {type: force, 7: 3d10}
    text:
      zh: |-
        把至多 8 个生物传送到任意已知地点。
      en: |-
        This spell instantly transports you and up to eight willing creatures that you can see within range, or a single object that you can see within range, to a destination you select. If you target an object, it must be Large or smaller, and it can't be held or carried by an unwilling creature. The destination you choose must be known to you, and it must be on the same plane of existence as you. Your familiarity with the destination determines whether you arrive there successfully. The GM rolls 1d100 and consults the Teleportation Outcome table and the explanations after it. Teleportation Outcome Familiarity Mishap Similar Area Off Target On Target Permanent circle 01-00 Linked object 01-00 Very familiar 01-05 06-13 14-24 25-00 Seen casually 01-33 34-43 44-53 54-00 Viewed once or described 01-43 44-53 54-73 74-00 False destination 01-50 51-00 - Familiarity. Here are the meanings of the terms in the table's Familiarity column: • "Permanent circle" means a permanent teleportation circle whose sigil sequence you know. • "Linked object" means you possess an object taken from the desired destination within the last six months, such as a book from a wizard's library. • "Very familiar" is a place you have visited often, a place you have carefully studied, or a place you can see when you cast the spell. • "Seen casually" is a place you have seen more than once but with which you aren't very familiar. • "Viewed once or described" is a place you have seen once, possibly using magic, or a place you know through someone else's description, perhaps from a map. • "False destination" is a place that doesn't exist. Perhaps you tried to scry an enemy's sanctum but instead viewed an illusion, or you are attempting to teleport to a location that no longer exists. Mishap. The spell's unpredictable magic results in a difficult journey. Each teleporting creature (or the target object) takes 3d10 Force damage, and the GM rerolls on the table to see where you wind up (multiple mishaps can occur, dealing damage each time). Similar Area. You and your group (or the target object) appear in a different area that's visually or thematically similar to the target area. You appear in the closest similar place. If you are heading for your home laboratory, for example, you might appear in another person's laboratory in the same city. Off Target. You and your group (or the target object) appear 2d12 miles away from the destination in a random direction. Roll 1d8 for the direction: 1, east; 2, southeast; 3, south; 4, southwest; 5, west; 6, northwest; 7, north; or 8, northeast. On Target. You and your group (or the target object) appear where you intended.
