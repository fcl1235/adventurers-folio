# hand-edited: 部分特性已手写真实机制（生成器不覆盖本文件）
# 由 tools/gen_classes.py 从 data/raw/* + dnd55e_classes_detail.json 生成。
# 重跑生成器会覆盖本文件；要长期改动请改数据源，或改完这里再把它从生成列表里去掉。
# 特性目前一律是 passive + note：规则原文已登记，数值结算随 P5 后续逐条落地。

id: dnd2024.class.barbarian
name: {zh: 野蛮人, en: Barbarian}
hit_die: 12
primary: [str]
saves: [str, con]
proficiencies:
  weapons: [simple, martial]
  armor: [light, medium, shield]
caster: none
subclass_level: 3
skill_choices: 2
skill_list:
  - animal-handling
  - athletics
  - intimidation
  - nature
  - perception
  - survival

resources:
  - id: dnd2024.resource.barbarian.rage
    kind: charge
    refresh: long_rest
    recover_on_short_rest: 1
    label: {zh: 狂暴, en: Rage}
    by_level: { 1: 2, 2: 2, 3: 3, 4: 3, 5: 3, 6: 4, 7: 4, 8: 4, 9: 4, 10: 4, 11: 4, 12: 5, 13: 5, 14: 5, 15: 5, 16: 5, 17: 6, 18: 6, 19: 6, 20: 6 }


powers:
  - id: dnd2024.class.barbarian.rage
    name: {zh: 狂暴, en: Rage}
    level: 1
    kind: passive
    target: self
    text:
      zh: |-
        附赠动作进入狂暴（不穿重甲）：钝击/穿刺/挥砍抗性、力量攻击伤害加值、力量检定与豁免优势。次数见「职业资源」。
      en: |-
        You can imbue yourself with a primal power called Rage, a force that grants you extraordinary might and resilience. You can enter it as a Bonus Action if you aren't wearing Heavy armor. You can enter your Rage the number of times shown for your Barbarian level in the Rages column of the Barbarian Features table. You regain one expended use when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest. While active, your Rage follows the rules below. Damage Resistance. You have Resistance to Bludgeoning, Piercing, and Slashing damage. Rage Damage. When you make an attack using Strength-with either a weapon or an Unarmed Strike-and deal damage to the target, you gain a bonus to the damage that increases as you gain levels as a Barbarian, as shown in the Rage Damage column of the Barbarian Features table. Strength Advantage. You have Advantage on Strength checks and Strength saving throws. No Concentration or Spells. You can't maintain Concentration, and you can't cast spells. Duration. The Rage lasts until the end of your next turn, and it ends early if you don Heavy armor or have the Incapacitated condition. If your Rage is still active on your next turn, you can extend the Rage for another round by doing one of the following: - Make an attack roll against an enemy. - Force an enemy to make a saving throw. - Take a Bonus Action to extend your Rage. Each time the Rage is extended, it lasts until the end of your next turn. You can maintain a Rage for up to 10 minutes.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.barbarian.unarmored_defense
    name: {zh: 无甲防御, en: Unarmored Defense}
    level: 1
    kind: passive
    target: self
    text:
      zh: |-
        未穿护甲时 AC = 10 + 敏捷调整值 + 体质调整值（可用盾牌）。
      en: |-
        While you aren't wearing any armor, your base Armor Class equals 10 plus your Dexterity and Constitution modifiers. You can use a Shield and still gain this benefit.
    effects:
      - grant_modifier:
          target: ac
          value: ability.con
          when: { unarmored: true }
      - note:
          zh: |-
            未穿护甲时 AC = 10 + 敏捷调整值 + 体质调整值（可用盾牌）。
          en: |-
            While you aren't wearing armor, your AC equals 10 plus your Dex modifier plus your Con modifier. You can use a Shield and still gain this benefit.
  - id: dnd2024.class.barbarian.weapon_mastery
    name: {zh: 武器专精, en: Weapon Mastery}
    level: 1
    kind: passive
    target: self
    text:
      zh: |-
        选 2 件熟练武器启用其专精属性（数量随等级提升）。
      en: |-
        Your training with weapons allows you to use the mastery properties of two kinds of Simple or Martial Melee weapons of your choice, such as Greataxes and Handaxes. Whenever you finish a Long Rest, you can practice weapon drills and change one of those weapon choices. When you reach certain Barbarian levels, you gain the ability to use the mastery properties of more kinds of weapons, as shown in the Weapon Mastery column of the Barbarian Features table.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.barbarian.danger_sense
    name: {zh: 危险感知, en: Danger Sense}
    level: 2
    kind: passive
    target: self
    text:
      zh: |-
        未失能时，对可见危险（陷阱、法术等）的敏捷豁免有优势。
      en: |-
        You gain an uncanny sense of when things aren't as they should be, giving you an edge when you dodge perils. You have Advantage on Dexterity saving throws unless you have the Incapacitated condition.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.barbarian.reckless_attack
    name: {zh: 鲁莽攻击, en: Reckless Attack}
    level: 2
    kind: passive
    target: self
    text:
      zh: |-
        本回合首次力量攻击可选择优势；代价是到你下回合开始前，对你也全部有优势。
      en: |-
        You can throw aside all concern for defense to attack with increased ferocity. When you make your first attack roll on your turn, you can decide to attack recklessly. Doing so gives you Advantage on attack rolls using Strength until the start of your next turn, but attack rolls against you have Advantage during that time.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.barbarian.subclass
    name: {zh: 子职：道途, en: Barbarian Subclass}
    level: 3
    kind: passive
    target: self
    text:
      zh: |-
        3 级选择一个道途（子职），获得其 3 级特性。
      en: |-
        You gain a Barbarian subclass of your choice. A subclass is a specialization that grants you features at certain Barbarian levels. For the rest of your career, you gain each of your subclass's features that are of your Barbarian level or lower.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.barbarian.primal_knowledge
    name: {zh: 原始知识, en: Primal Knowledge}
    level: 3
    kind: passive
    target: self
    text:
      zh: |-
        额外获得 1 项技能熟练（驯兽/威吓/自然/察觉/生存）；狂暴时可用力量代替该检定的属性。
      en: |-
        You gain proficiency in another skill of your choice from the skill list available to Barbarians at level 1. In addition, while your Rage is active, you can channel primal power when you attempt certain tasks; whenever you make an ability check using one of the following skills, you can make it as a Strength check even if it normally uses a different ability: Acrobatics, Intimidation, Perception, Stealth, or Survival. When you use this ability, your Strength represents primal power coursing through you, honing your agility, bearing, and senses.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

