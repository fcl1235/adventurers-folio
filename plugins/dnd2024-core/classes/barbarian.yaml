  - id: dnd2024.class.barbarian.primal_champion
    name: {zh: 原始冠军, en: Primal Champion}
    level: 20
    kind: passive
    target: self
    text:
      zh: |-
        力量与体质各 +4，上限提升到 25。
      en: |-
        You embody primal power. Your Strength and Constitution scores increase by 4, to a maximum of 25.
    effects:
      # 属性加值通道：改的是属性值本身，HP / AC / 攻击 / 豁免跟着一起变。
      # cap 写 25 而不是 30 —— 30 是传奇恩惠那条通道的上限。
      - grant_modifier:
          modifiers:
            - {target: score.str, value: 4, cap: 25}
            - {target: score.con, value: 4, cap: 25}
