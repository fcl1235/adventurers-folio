  - id: dnd2024.class.barbarian.fast_movement
    name: {zh: 快速移动, en: Fast Movement}
    level: 5
    kind: passive
    target: self
    text:
      zh: |-
        不穿重甲时速度 +10 尺。
      en: |-
        Your speed increases by 10 feet while you aren't wearing Heavy armor.
    effects:
      # 只禁重甲：轻甲/中甲/无甲都给。事实一条 `armor` 就够表达
      - grant_modifier:
          target: speed.walk
          value: 10
          when: { armor_ne: heavy }

