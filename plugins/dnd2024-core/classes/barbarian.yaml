  - id: dnd2024.class.barbarian.brutal_strike
    name: {zh: 凶蛮打击, en: Brutal Strike}
    level: 9
    kind: passive
    target: self
    text:
      zh: |-
        可放弃攻击优势，换取 +1d10 伤害并附加击退 15 尺或击倒等效果。
      en: |-
        If you use Reckless Attack, you can forgo any Advantage on one Strength-based attack roll of your choice on your turn. The chosen attack roll mustn't have Disadvantage. If the chosen attack roll hits, the target takes an extra 1d10 damage of the same type dealt by the weapon or Unarmed Strike, and you can cause one Brutal Strike effect of your choice. You have the following effect options. Forceful Blow. The target is pushed 15 feet straight away from you. You can then move up to half your Speed straight toward the target without provoking Opportunity Attacks. Hamstring Blow. The target's Speed is reduced by 15 feet until the start of your next turn. A target can be affected by only one Hamstring Blow at a timethe most recent one.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.barbarian.relentless_rage
    name: {zh: 不屈狂怒, en: Relentless Rage}
    level: 11
    kind: passive
    target: self
    text:
      zh: |-
        狂暴中降到 0 HP 时，可做 DC 10 体质豁免（每次递增 5），成功则保持 1 HP。
      en: |-
        Your Rage can keep you fighting despite grievous wounds. If you drop to 0 Hit Points while your Rage is active and don't die outright, you can make a DC 10 Constitution saving throw. If you succeed, your Hit Points instead change to a number equal to twice your Barbarian level. Each time you use this feature after the first, the DC increases by 5. When you finish a Short or Long Rest, the DC resets to 10.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.barbarian.improved_brutal_strike_1
    name: {zh: 强化凶蛮打击, en: Improved Brutal Strike}
    level: 13
    kind: passive
    target: self
    text:
      zh: |-
        凶蛮打击可再选一种效果（削弱目标的下次豁免等）。
      en: |-
        You have honed new ways to attack furiously. The following effects are now among your Brutal Strike options. Staggering Blow. The target has Disadvantage on the next saving throw it makes, and it can't make Opportunity Attacks until the start of your next turn. Sundering Blow. Before the start of your next turn, the next attack roll made by another creature against the target gains a +5 bonus to the roll. An attack roll can gain only one Sundering Blow bonus.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.barbarian.persistent_rage
    name: {zh: 持久狂暴, en: Persistent Rage}
    level: 15
    kind: passive
    target: self
    text:
      zh: |-
        狂暴不再需要每回合维持；长休时直接恢复全部狂暴次数。
      en: |-
        When you roll Initiative, you can regain all expended uses of Rage. After you regain uses of Rage in this way, you can't do so again until you finish a Long Rest. In addition, your Rage is so fierce that it now lasts for 10 minutes without you needing to do anything to extend it from round to round. Your Rage ends early if you have the Unconscious condition (not just the Incapacitated condition) or don Heavy armor.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

