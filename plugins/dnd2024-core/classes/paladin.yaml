powers:
  - id: dnd2024.class.paladin.lay_on_hands
    name: {zh: 圣疗, en: Lay On Hands}
    level: 1
    kind: passive
    target: self
    text:
      zh: |-
        治疗池 = 5 × 圣武士等级（长休回满）；附赠动作治疗，或花 5 点解除中毒。
      en: |-
        Your blessed touch can heal wounds. You have a pool of healing power that replenishes when you finish a Long Rest. With that pool, you can restore a total number of Hit Points equal to five times your Paladin level. As a Bonus Action, you can touch a creature (which could be yourself) and draw power from the pool of healing to restore a number of Hit Points to that creature, up to the maximum amount remaining in the pool. You can also expend 5 Hit Points from the pool of healing power to remove the Poisoned condition from the creature; those points don't also restore Hit Points to the creature.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.paladin.spellcasting
    name: {zh: 施法, en: Spellcasting}
    level: 1
    kind: passive
    target: self
    text:
      zh: |-
        以魅力施法（1 级起即有法术位）。
      en: |-
        You have learned to cast spells through prayer and meditation. See "Spells" for the rules on spellcasting. The information below details how you use those rules with Paladin spells, which appear in the Paladin spell list later in the class's description. Spell Slots. The Paladin Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a Long Rest. Prepared Spells of Level 1+. You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose two level 1 Paladin spells. Heroism and Searing Smite are recommended. The number of spells on your list increases as you gain Paladin levels, as shown in the Prepared Spells column of the Paladin Features table. Whenever that number increases, choose additional Paladin spells until the number of spells on your list matches the number in the Paladin Features table. The chosen spells must be of a level for which you have spell slots. For example, if you're a level 5 Paladin, your list of prepared spells can include six Paladin spells of level 1 or 2 in any combination. If another Paladin feature gives you spells that you always have prepared, those spells don't count against the number of spells you can prepare with this feature, but those spells otherwise count as Paladin spells for you. Changing Your Prepared Spells. Whenever you finish a Long Rest, you can replace one spell on your list with another Paladin spell for which you have spell slots. Spellcasting Ability. Charisma is your spellcasting ability for your Paladin spells. Spellcasting Focus. You can use a Holy Symbol as a Spellcasting Focus for your Paladin spells.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

