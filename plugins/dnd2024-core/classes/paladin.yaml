  - id: dnd2024.class.paladin.fighting_style
    name: {zh: 战斗风格, en: Fighting Style}
    level: 2
    kind: passive
    target: self
    text:
      zh: |-
        2 级：从战斗风格专长中选 1 个。
      en: |-
        You gain a Fighting Style feat of your choice (see "Feats" for feats). Instead of choosing one of those feats, you can choose the option below. Blessed Warrior. You learn two Cleric cantrips of your choice (see the Cleric class's section for a list of Cleric spells). Guidance and Sacred Flame are recommended. The chosen cantrips count as Paladin spells for you, and Charisma is your spellcasting ability for them. Whenever you gain a Paladin level, you can replace one of these cantrips with another Cleric cantrip.
    effects:
      - note:
