powers:
  - id: dnd2024.class.ranger.favored_enemy
    name: {zh: 宿敌, en: Favored Enemy}
    level: 1
    kind: passive
    target: self
    text:
      zh: |-
        始终准备 Hunter's Mark，可不耗法术位施放 2 次；5/9/13/17 级增至 3/4/5/6 次，长休全部恢复。
      en: |-
        You always have the Hunter's Mark spell prepared. You can cast it twice without expending a spell slot, and you regain all expended uses of this ability when you finish a Long Rest. The number of times you can cast the spell without a spell slot increases when you reach certain Ranger levels, as shown in the Favored Enemy column of the Ranger Features table.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.ranger.spellcasting
    name: {zh: 施法, en: Spellcasting}
    level: 1
    kind: passive
    target: self
    text:
      zh: |-
        以感知施法。
      en: |-
        You have learned to channel the magical essence of nature to cast spells. See "Spells" for the rules on spellcasting. The information below details how you use those rules with Ranger spells, which appear in the Ranger spell list later in the class's description. Spell Slots. The Ranger Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a Long Rest. Prepared Spells of Level 1+. You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose two level 1 Ranger spells. Cure Wounds and Ensnaring Strike are recommended. The number of spells on your list increases as you gain Ranger levels, as shown in the Prepared Spells column of the Ranger Features table. Whenever that number increases, choose additional Ranger spells until the number of spells on your list matches the number in the Ranger Features table. The chosen spells must be of a level for which you have spell slots. For example, if you're a level 5 Ranger, your list of prepared spells can include six Ranger spells of level 1 or 2 in any combination. If another Ranger feature gives you spells that you always have prepared, those spells don't count against the number of spells you can prepare with this feature, but those spells otherwise count as Ranger spells for you. Changing Your Prepared Spells. Whenever you finish a Long Rest, you can replace one spell on your list with another Ranger spell for which you have spell slots. Spellcasting Ability. Wisdom is your spellcasting ability for your Ranger spells. Spellcasting Focus. You can use a Druidic Focus as a Spellcasting Focus for your Ranger spells.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

