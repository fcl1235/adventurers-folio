  - id: dnd2024.class.cleric.blessed_strikes
    name: {zh: 祝福打击, en: Blessed Strikes}
    level: 7
    kind: passive
    target: self
    text:
      zh: |-
        戏法或武器攻击命中时，额外造成 1d8 光耀或死灵伤害（二选一）。
      en: |-
        Divine power infuses you in battle. You gain one of the following options of your choice (if you get either option from a Cleric subclass in an older book, use only the option you choose for this feature). Divine Strike. Once on each of your turns when you hit a creature with an attack roll using a weapon, you can cause the target to take an extra 1d8 Necrotic or Radiant damage (your choice). Potent Spellcasting. Add your Wisdom modifier to the damage you deal with any Cleric cantrip.
