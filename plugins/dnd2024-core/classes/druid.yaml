id: dnd2024.class.druid
name:
  zh: 德鲁伊
  en: Druid
hit_die: 8
primary: [wis]
saves: [int, wis]
proficiencies:
  weapons: [simple]
  armor: [light, medium, shield]
caster: full
casting_ability: wis
subclass_level: 3
skill_choices: 2
skill_list:
  - animal_handling
  - arcana
  - insight
  - medicine
  - nature
  - perception
  - religion
  - survival

# 法术位表：等级 → 1..9 环容量（由 tools/gen_classes.py 的数据源导出；
