powers:
  - id: dnd2024.class.sorcerer.innate_sorcery
    name: {zh: 先天魔法, en: Innate Sorcery}
    level: 1
    kind: passive
    target: self
    text:
      zh: |-
        附赠动作，1 分钟内术士法术豁免 DC +1、法术攻击掷骰有优势（2 次/长休，全部次数随长休恢复）。
      en: |-
        An event in your past left an indelible mark on you, infusing you with simmering magic. As a Bonus Action, you can unleash that magic for 1 minute, during which you gain the following benefits: - The spell save DC of your Sorcerer spells increases by 1. - You have Advantage on the attack rolls of Sorcerer spells you cast. You can use this feature twice, and you regain all expended uses of it when you finish a Long Rest.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.sorcerer.spellcasting
    name: {zh: 施法, en: Spellcasting}
    level: 1
    kind: passive
    target: self
    text:
      zh: |-
        以魅力施法，已知法术。
      en: |-
        Drawing from your innate magic, you can cast spells. See "Spells" for the rules on spellcasting. The information below details how you use those rules with Sorcerer spells, which appear in the Sorcerer spell list later in the class’s description. Cantrips. You know four Sorcerer cantrips of your choice. Light, Prestidigitation, Shocking Grasp, and Sorcerous Burst are recommended. Whenever you gain a Sorcerer level, you can replace one of your cantrips from this feature with another Sorcerer cantrip of your choice. When you reach Sorcerer levels 4 and 10, you learn another Sorcerer cantrip of your choice, as shown in the Cantrips column of the Sorcerer Features table. Spell Slots. The Sorcerer Features table shows how many spell slots you have to cast your level 1+ spells. You regain all expended slots when you finish a Long Rest. Prepared Spells of Level 1+. You prepare the list of level 1+ spells that are available for you to cast with this feature. To start, choose two level 1 Sorcerer spells. Burning Hands and Detect Magic are recommended. The number of spells on your list increases as you gain Sorcerer levels, as shown in the Prepared Spells column of the Sorcerer Features table. Whenever that number increases, choose additional Sorcerer spells until the number of spells on your list matches the number in the Sorcerer Features table. The chosen spells must be of a level for which you have spell slots. For example, if you’re a level 3 Sorcerer, your list of prepared spells can include six Sorcerer spells of level 1 or 2 in any combination. If another Sorcerer feature gives you spells that you always have prepared, those spells don’t count against the number of spells you can prepare with this feature, but those spells otherwise count as Sorcerer spells for you. Changing Your Prepared Spells. Whenever you gain a Sorcerer level, you can replace one spell on your list with another Sorcerer spell for which you have spell slots. Spellcasting Ability. Charisma is your spellcasting ability for your Sorcerer spells. Spellcasting Focus. You can use an Arcane Focus as a Spellcasting Focus for your Sorcerer spells.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.sorcerer.font_of_magic
    name: {zh: 魔法源泉, en: Font of Magic}
    level: 2
    kind: passive
    target: self
    text:
      zh: |-
        术法点数量 = 术士等级；可在法术位与术法点之间互换。
      en: |-
        You can tap into the wellspring of magic within yourself. This wellspring is represented by Sorcery Points, which allow you to create a variety of magical effects. You have 2 Sorcery Points, and you gain more as you reach higher levels, as shown in the Sorcery Points column of the Sorcerer Features table. You can’t have more Sorcery Points than the number shown in the table for your level. You regain all expended Sorcery Points when you finish a Long Rest. You can use your Sorcery Points to fuel the options below, along with other features, such as Metamagic, that use those points. Converting Spell Slots to Sorcery Points. You can expend a spell slot to gain a number of Sorcery Points equal to the slot’s level (no action required). Creating Spell Slots. As a Bonus Action, you can transform unexpended Sorcery Points into one spell slot. The Creating Spell Slots table shows the cost of creating a spell slot of a given level, and it lists the minimum Sorcerer level you must be to create a slot. You can create a spell slot no higher than level 5. Any spell slot you create with this feature vanishes when you finish a Long Rest. Creating Spell Slots Spell Slot Level | Sorcery Point Cost | Min. Sorcerer Level 1 | 2 | 2 2 | 3 | 3 3 | 5 | 5 4 | 6 | 7 5 | 7 | 9
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

  - id: dnd2024.class.sorcerer.convert_slot_to_points
    name: {zh: 法术位化术法点, en: Convert Spell Slot to Sorcery Points}
    level: 2
    kind: activated
    target: self
    text:
      zh: |-
        无动作消耗一个法术位，获得等于其环级的术法点。
      en: |-
        As no action, expend a spell slot to gain Sorcery Points equal to the slot's level.
    effects:
      - exchange:
          direction: slots_to_points
          pool: dnd2024.resource.sorcerer.sorcery

  - id: dnd2024.class.sorcerer.create_spell_slot
    name: {zh: 创造法术位, en: Creating Spell Slots}
    level: 2
    kind: activated
    target: self
    cost: {action: bonus}
    text:
      zh: |-
        附赠动作，按表花术法点造一个法术位（最高 5 环），长休消失。
        造 1 环 2 点（术士 2 级起）、2 环 3 点（3 级）、3 环 5 点（5 级）、
        4 环 6 点（7 级）、5 环 7 点（9 级）。
      en: |-
        As a Bonus Action, transform unexpended Sorcery Points into one spell slot
        (no higher than level 5). The slot vanishes when you finish a Long Rest.
    effects:
      - exchange:
          direction: points_to_slots
          pool: dnd2024.resource.sorcerer.sorcery
          options:
            - {slot_level: 1, cost: 2, min_level: 2}
            - {slot_level: 2, cost: 3, min_level: 3}
            - {slot_level: 3, cost: 5, min_level: 5}
            - {slot_level: 4, cost: 6, min_level: 7}
            - {slot_level: 5, cost: 7, min_level: 9}

  - id: dnd2024.class.sorcerer.metamagic
    name: {zh: 超魔法, en: Metamagic}
    level: 2
    kind: passive
    target: self
    text:
      zh: |-
        2 级选 2 个超魔法选项（法术强化、孪生、瞬发等），10 级与 17 级各再 +2；使用需付术法点，每个法术只能用 1 个。
      en: |-
        Because your magic flows from within, you can alter your spells to suit your needs; you gain two Metamagic options of your choice from "Metamagic Options" later in this class’s description. You use the chosen options to temporarily modify spells you cast. To use an option, you must spend the number of Sorcery Points that it costs. You can use only one Metamagic option on a spell when you cast it unless otherwise noted in one of those options. Whenever you gain a Sorcerer level, you can replace one of your Metamagic options with one you don’t know. You gain two more options at Sorcerer level 10 and two more at Sorcerer level 17.
    effects:
      - note:
          zh: |-
            数值结算见 P5 后续：本条先登记规则原文。
          en: |-
            Number resolution lands later in P5; the rule text is registered here.

