# 2024 SRD 护甲与盾。AC 公式的系数写在数据里，规则层只按类别组合（rules/armor.py）。
#
# 字段：
#   kind      固定 armor（文件里暂时只有护甲；武器随 P5c 进来）
#   category  light / medium / heavy / shield
#   ac_base   穿着时的基础 AC（「10 + 敏捷」被它顶掉）
#   dex_cap   敏捷上限：null 表示无上限，0 表示完全不吃敏捷（重甲仍扣负敏捷）
#   bonus     仅盾牌：加值
#   str_req   力量需求（展示用；速度惩罚要等负重系统）
#   stealth   隐匿检定劣势（展示用，由界面读）

