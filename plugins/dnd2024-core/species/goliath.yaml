id: dnd2024.species.goliath
name: {zh: 巨人, en: Goliath}
summary:
  zh: |-
    山岭巨人的后裔：跑得更快、力气更大，血统与巨躯形态各给一段爆发。
  en: |-
    Descendants of giants: faster on their feet, powerful of build, with a giant ancestry boon and a large-form burst.
size: [medium]
speed: 35

powers:
