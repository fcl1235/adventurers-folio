# SRD 5.2 覆盖这一条：dnd55e_core_data.json 的 species 清单只用来确认条目，正文按 2024 原文重写

id: dnd2024.species.gnome
name: {zh: 侏儒, en: Gnome}
summary:
  zh: |-
    小个子的魔法工匠：黑暗视觉、智力/感知/魅力豁免有优势，血脉再送戏法与法术。
  en: |-
    Small magical tinkerers with darkvision, advantage on Intelligence, Wisdom and Charisma saves, and lineage spells.
size: [small]
speed: 30

powers:
  - id: dnd2024.species.gnome.darkvision
    name: {zh: 黑暗视觉, en: Darkvision}
    level: 1
    kind: passive
    target: self
    text:
      zh: |-
        你在 60 尺内的微光光照中视为明亮光照，在黑暗中视为微光光照，只能分辨灰阶，无法分辨颜色。
      en: |-
        Darkvision — this plugin does not carry the SRD 5.2 English wording of this rule; the normalized Chinese text above is the authoritative copy.
    effects:
      - grant_modifier: {target: sense.darkvision, value: 60, stack: max}

  - id: dnd2024.species.gnome.gnomish_cunning
    name: {zh: 侏儒狡黠, en: Gnomish Cunning}
    level: 1
    kind: passive
    target: self
    text:
      zh: |-
        你对智力、感知、魅力豁免检定有优势。
      en: |-
        Gnomish Cunning — this plugin does not carry the SRD 5.2 English wording of this rule; the normalized Chinese text above is the authoritative copy.
    effects:
      - grant_advantage: {target: save.int, mode: adv}
      - grant_advantage: {target: save.wis, mode: adv}
      - grant_advantage: {target: save.cha, mode: adv}

  - id: dnd2024.species.gnome.gnomish_lineage
    name: {zh: 侏儒血脉, en: Gnomish Lineage}
    level: 1
    kind: passive
    target: self
    text:
      zh: |-
        选择森林侏儒（戏法 次级幻影；动物交谈 始终备好并可用熟练加值次数免费施放）或岩地侏儒（戏法 修复术 与 魔法伎俩）。
      en: |-
        Gnomish Lineage — this plugin does not carry the SRD 5.2 English wording of this rule; the normalized Chinese text above is the authoritative copy.
    effects:
      - note:
          zh: |-
            物种法术来源与免费施放次数池尚未接入。
          en: |-
            The mechanical part of this trait is not wired yet; the rule text above is the source.
